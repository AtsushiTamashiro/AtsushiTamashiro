<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ようかい ぽんぽこバトル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="にほんの むかしばなしの ようかいが かわいく なって バトル!かって ともだちに して、ようかいずかんを うめよう。">
<meta name="theme-color" content="#2E2657">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: スマホ縦1画面のゲーム機。デスクトップでは よぞらの上に浮かぶ1台。 */
:root {
  --pink: #FF7BA9; --pink-d: #E25A8C; --pink-l: #FFE1EC;
  --cream: #FFF8EE; --butter: #FFE58A; --mint: #8FDCC4; --sky: #A9DCFF; --lav: #CDBBFF; --lav-l: #EEE7FF;
  --night: #2E2657; --night-2: #4A3C86; --lantern: #FFB547;
  --ink: #3D2E4F; --ink-2: #7A6A8C; --white: #FFFFFF; --line: #EADFF2;
  --f-pop: "Mochiy Pop One", "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
  --f-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--f-body); font-weight: 700;
  background-color: var(--night);
  background-image: radial-gradient(circle, rgba(255,255,255,.5) 1.5px, transparent 2px), radial-gradient(circle, rgba(255,230,150,.35) 1.5px, transparent 2px);
  background-size: 46px 46px, 70px 70px; background-position: 0 0, 23px 31px;
  user-select: none; -webkit-user-select: none; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
#app {
  position: relative; height: 100%; max-width: 460px; margin: 0 auto; overflow: hidden;
  background: var(--cream); box-shadow: 0 0 0 4px #5C4C9C, 0 20px 60px rgba(0, 0, 0, .4);
}
@media (min-width: 520px) and (min-height: 760px) {
  #app { height: calc(100% - 40px); margin-top: 20px; border-radius: 34px; max-height: 920px; }
}
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); -webkit-overflow-scrolling: touch; }
svg.sil { filter: brightness(0) invert(.25) sepia(.4) hue-rotate(220deg); opacity: .55; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--f-pop); font-weight: 400; font-size: 18px; letter-spacing: .04em;
  padding: 14px 24px; border-radius: 999px; color: var(--white); background: var(--pink);
  box-shadow: 0 5px 0 var(--pink-d), 0 9px 16px rgba(226, 90, 140, .3);
  transition: transform .08s, box-shadow .08s; text-shadow: 0 2px 0 rgba(0,0,0,.08); white-space: nowrap;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-d); }
.btn.sub { background: var(--white); color: var(--pink-d); box-shadow: 0 5px 0 #EBCADB, 0 9px 16px rgba(120, 60, 140, .12); }
.btn.sub:active { box-shadow: 0 1px 0 #EBCADB; }
.btn.mint { background: #5FC9A9; box-shadow: 0 5px 0 #3FA587, 0 9px 16px rgba(63, 165, 135, .3); }
.btn.gold { background: linear-gradient(180deg, #FFD46B, #FFB43B); color: #7A4A10; box-shadow: 0 5px 0 #D98E1E, 0 9px 16px rgba(217,142,30,.35); }
.btn.small { font-size: 14px; padding: 9px 14px; box-shadow: 0 4px 0 var(--pink-d); }
.btn.small.sub { box-shadow: 0 4px 0 #EBCADB; }
.btn[disabled] { filter: grayscale(.8); opacity: .55; pointer-events: none; }
.icon-btn { width: 42px; height: 42px; flex: none; border-radius: 50%; background: var(--white); font-size: 20px; display: grid; place-items: center; box-shadow: 0 3px 0 #E2D3EC; }
.link { color: var(--ink-2); font-size: 13px; padding: 8px; }

/* ---------- title ---------- */
#title { background: linear-gradient(180deg, #2A2257 0%, #5B4597 48%, #E39AC0 82%, #FFE3D0 100%); align-items: center; justify-content: center; text-align: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); gap: 6px; }
.moon { position: absolute; top: 7%; left: 12%; width: 74px; height: 74px; border-radius: 50%; background: #FFF4C2; box-shadow: 0 0 40px 10px rgba(255, 240, 180, .45); }
.moon::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #F2E3A6; left: 18px; top: 22px; box-shadow: 26px 14px 0 -3px #F2E3A6; }
.star { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #FFF6CF; animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .2; transform: scale(.6); } }
.logo-wrap { position: relative; z-index: 2; }
.logo-small { font-family: var(--f-pop); color: var(--ink); background: var(--butter); display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: 13px; transform: rotate(-3deg); box-shadow: 0 3px 0 #D9B640; }
.logo {
  font-family: var(--f-pop); font-weight: 400; font-size: clamp(38px, 11.5vw, 54px); line-height: 1.12; margin: 10px 0 0; color: var(--white);
  -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; letter-spacing: .02em; text-shadow: 0 6px 0 var(--ink);
}
.logo .l1 { color: #C9B8FF; } .logo .l2 { color: #FFB547; }
.title-charas { position: relative; height: 180px; width: 100%; max-width: 380px; margin: 0 auto 4px; z-index: 2; }
.title-charas .tc { position: absolute; }
.title-charas .tc svg { width: 100%; height: auto; display: block; }
.title-menu { display: flex; flex-direction: column; gap: 14px; width: min(280px, 100%); z-index: 2; align-items: stretch; }
.title-menu .small { align-self: center; }
.title-note { font-size: 11px; color: var(--ink); opacity: .75; margin: 6px 0 0; z-index: 2; }

.bounce { animation: bounce 1.6s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes bounce { 0%,100% { transform: translateY(0) scale(1, 1); } 45% { transform: translateY(-8px) scale(.98, 1.03); } 55% { transform: translateY(-8px); } 85% { transform: translateY(0) scale(1.04, .96); } }

/* ---------- header bar ---------- */
.bar { display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--white); border-bottom: 3px dashed var(--line); z-index: 3; }
.bar h2 { flex: 1; margin: 0; font-family: var(--f-pop); font-weight: 400; font-size: 18px; color: var(--night-2); text-wrap: balance; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 999px; background: var(--lav-l); color: var(--night-2); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lead { font-size: 14px; line-height: 1.7; margin: 4px 0 14px; }

/* ---------- starter ---------- */
.starters { display: flex; flex-direction: column; gap: 12px; }
.starter { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--white); border-radius: 26px; padding: 10px 14px; box-shadow: 0 5px 0 var(--line); position: relative; overflow: hidden; transition: transform .1s; }
.starter:active { transform: scale(.97); }
.starter::before { content: ""; position: absolute; left: -30px; top: -30px; width: 160px; height: 160px; border-radius: 50%; background: var(--tc); opacity: .6; }
.st-art { width: 108px; flex: none; position: relative; }
.st-art svg { width: 100%; display: block; }
.st-info { position: relative; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; min-width: 0; }
.st-info b { font-family: var(--f-pop); font-weight: 400; font-size: 20px; }
.st-info small { font-size: 12px; color: var(--ink-2); line-height: 1.5; font-weight: 500; }

/* ---------- type chips / tiles ---------- */
.ty { display: inline-flex; align-items: center; gap: 3px; padding: 2px 9px 2px 6px; border-radius: 999px; font-size: 12px; color: var(--ink); background: var(--tc); white-space: nowrap; }
.rare { color: #F0A21E; font-size: 14px; letter-spacing: -1px; }
.rare.r4 { color: #FF6FA8; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; padding: 8px 14px; border-radius: 999px; background: var(--white); font-size: 13px; color: var(--ink-2); box-shadow: 0 3px 0 var(--line); white-space: nowrap; }
.tab.on { background: var(--night-2); color: var(--white); box-shadow: 0 3px 0 #2E2657; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { position: relative; background: var(--white); border-radius: 20px; padding: 6px 4px 8px; text-align: center; box-shadow: 0 4px 0 var(--line); transition: transform .12s; min-width: 0; }
.tile:active { transform: scale(.95); }
.tile svg { width: 100%; height: auto; display: block; position: relative; }
.tile .tn { font-size: 10.5px; color: var(--ink-2); line-height: 1.2; font-variant-numeric: tabular-nums; position: relative; }
.tile .tc-name { font-size: 11px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
.tile.sel { box-shadow: 0 0 0 3px var(--pink), 0 4px 0 var(--pink-d); }
.tile.unk { background: #F3EEF8; }
.tile.unk .tc-name { color: var(--ink-2); }
.tile .q { aspect-ratio: 1; display: grid; place-items: center; font-family: var(--f-pop); font-size: 30px; color: #CBBEDB; }
.tile .stamp { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--butter); display: grid; place-items: center; font-size: 12px; box-shadow: 0 2px 0 #E4BE4A; transform: rotate(12deg); z-index: 2; font-variant-numeric: tabular-nums; }
.tile .tbg { position: absolute; left: 8%; right: 8%; top: 20px; aspect-ratio: 1; border-radius: 50%; opacity: .5; }

/* ---------- sheet ---------- */
.veil { position: absolute; inset: 0; background: rgba(46, 38, 87, .5); z-index: 20; display: flex; align-items: flex-end; animation: fade .2s; }
.veil.center { align-items: center; justify-content: center; padding: 16px; background: rgba(36, 28, 70, .85); overflow-y: auto; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-height: 92%; overflow-y: auto; background: var(--cream); border-radius: 30px 30px 0 0; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); animation: up .28s cubic-bezier(.2,1.3,.4,1); }
@keyframes up { from { transform: translateY(60%); } }
.sheet h3 { margin: 0; font-family: var(--f-pop); font-weight: 400; font-size: 22px; line-height: 1.25; }
.sheet-head { display: flex; gap: 14px; align-items: center; }
.sheet-art { width: 124px; flex: none; border-radius: 50%; padding: 6px; }
.sheet-art svg { width: 100%; height: auto; display: block; }
.sheet .pref { font-size: 12px; color: var(--ink-2); }
.kanji { font-size: 13px; color: var(--ink-2); margin-top: 1px; }
.pc-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0 0; font-size: 13px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 0; }
.facts div { background: var(--white); border-radius: 14px; padding: 7px 12px; box-shadow: 0 3px 0 var(--line); }
.facts small { display: block; font-size: 11px; color: var(--ink-2); }
.facts b { font-size: 14px; }
.lore { font-size: 14px; line-height: 1.75; font-weight: 500; background: var(--white); border-radius: 16px; padding: 10px 14px; margin: 10px 0; box-shadow: 0 3px 0 var(--line); text-wrap: pretty; }
.locked-lore { color: var(--ink-2); text-align: center; }
.stats { display: grid; grid-template-columns: auto 1fr 2.5em; gap: 5px 8px; align-items: center; font-size: 12px; margin: 12px 0 8px; font-variant-numeric: tabular-nums; }
.stats b { text-align: right; }
.stats .meter { height: 10px; border-radius: 99px; background: #EFE6F5; overflow: hidden; }
.stats .meter i { display: block; height: 100%; border-radius: 99px; background: var(--night-2); }
.moves-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 16px; }
.mv-info { border-radius: 16px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 3px 0 rgba(61,46,79,.12); min-width: 0; }
.mv-info b { display: block; font-size: 13px; line-height: 1.3; margin-bottom: 3px; overflow-wrap: anywhere; }
.mv-info small { color: var(--ink-2); font-size: 11px; }
.sheet-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.sheet-actions .btn { flex: 1 1 40%; font-size: 15px; padding: 13px 12px; }
.howto { padding-left: 1.3em; margin: 10px 0 12px; font-size: 14px; line-height: 1.7; font-weight: 500; }
.howto li { margin-bottom: 4px; }
.chart { display: flex; flex-direction: column; gap: 6px; background: var(--white); border-radius: 16px; padding: 10px 12px; box-shadow: 0 3px 0 var(--line); }
.chart-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; flex-wrap: wrap; }
.chart-row .strong { display: inline-flex; gap: 4px; }
.hint { font-size: 12px; color: var(--ink-2); margin: 8px 0 0; text-align: center; }
.boss-sheet { text-align: center; }
.boss-art { width: 150px; margin: 0 auto 6px; }
.boss-art svg { width: 100%; display: block; }

/* ---------- home ---------- */
.party-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.pslot { position: relative; background: var(--white); border-radius: 22px; padding: 8px 6px 9px; text-align: center; box-shadow: 0 4px 0 var(--line); display: flex; flex-direction: column; align-items: center; overflow: hidden; min-width: 0; }
.pslot::before { content: ""; position: absolute; left: 50%; top: 14px; width: 78%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: var(--tc, transparent); opacity: .55; }
.pslot.lead { box-shadow: 0 0 0 3px var(--lantern), 0 4px 0 #D98E1E; }
.pslot em { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 10px; background: var(--lantern); color: #6A3E00; border-radius: 99px; padding: 1px 8px; z-index: 2; white-space: nowrap; }
.ps-art { width: 82%; position: relative; margin-top: 8px; }
.ps-art svg { width: 100%; display: block; }
.pslot b { font-size: 12px; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pslot small { font-size: 11px; color: var(--ink-2); position: relative; }
.pslot.empty { justify-content: center; background: transparent; border: 3px dashed #DCCFE8; box-shadow: none; color: #BCAED0; min-height: 120px; }
.pslot.empty span { font-size: 28px; line-height: 1; }
.progress { background: var(--white); border-radius: 22px; padding: 12px 14px; box-shadow: 0 4px 0 var(--line); margin-bottom: 14px; }
.progress .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; gap: 8px; flex-wrap: wrap; }
.progress .big { font-family: var(--f-pop); font-size: 22px; color: var(--pink-d); font-variant-numeric: tabular-nums; }
.pbar { height: 14px; border-radius: 99px; background: #EFE6F5; overflow: hidden; margin-top: 6px; }
.pbar i { display: block; height: 100%; border-radius: 99px; background: repeating-linear-gradient(-45deg, var(--pink) 0 10px, #FF9DC0 10px 20px); transition: width .6s; }
.home-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.home-actions .btn { font-size: 16px; padding: 13px 10px; }
.section-title { font-family: var(--f-pop); font-weight: 400; font-size: 16px; margin: 6px 0 10px; display: flex; align-items: center; gap: 8px; }
.areas { display: flex; flex-direction: column; gap: 12px; }
.area { position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-areas: "ico info" "btns btns"; gap: 6px 10px; padding: 12px 14px; border-radius: 24px; overflow: hidden;
  background: linear-gradient(120deg, var(--s1), var(--s2) 70%); box-shadow: 0 5px 0 var(--s3); }
.area .a-ico { grid-area: ico; font-size: 30px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.85); display: grid; place-items: center; position: relative; z-index: 1; }
.area .a-info { grid-area: info; min-width: 0; position: relative; z-index: 1; padding-right: 76px; }
.area .a-info b { font-family: var(--f-pop); font-weight: 400; font-size: 18px; display: block; background: rgba(255,255,255,.85); border-radius: 10px; padding: 0 8px; width: fit-content; }
.area .a-info small { display: inline-block; font-size: 11.5px; background: rgba(255,255,255,.85); border-radius: 8px; padding: 1px 8px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.area .a-info p { margin: 6px 0 0; font-size: 12px; line-height: 1.5; font-weight: 500; background: rgba(255,255,255,.78); border-radius: 10px; padding: 4px 8px; }
.area .a-btns { grid-area: btns; display: flex; gap: 8px; position: relative; z-index: 1; }
.area .a-btns .btn { flex: 1; }
.area .boss { background: var(--night-2); box-shadow: 0 4px 0 #2E2657; }
.area .boss.done { background: linear-gradient(180deg, #FFD46B, #FFB43B); color: #7A4A10; box-shadow: 0 4px 0 #D98E1E; }
.area .a-boss { position: absolute; right: 6px; top: 4px; width: 84px; opacity: .95; }
.area .a-boss svg { width: 100%; display: block; }
.area.locked { background: #EAE3F0; box-shadow: 0 5px 0 #D6CCE0; grid-template-areas: "ico info"; color: var(--ink-2); }
.area.locked .a-ico { background: #F6F2FA; font-size: 24px; }
.area.locked .a-info { padding-right: 0; }
.area.locked .a-info b { background: none; padding: 0; }
.area.locked .a-info small { background: none; padding: 0; }
.secret-note { margin-top: 14px; text-align: center; font-size: 13px; background: linear-gradient(90deg, #FFF3C4, #FFE1EC); border-radius: 16px; padding: 10px; box-shadow: 0 3px 0 #F0D88A; }
.home-foot { display: flex; justify-content: center; gap: 16px; margin-top: 16px; }

/* ---------- book ---------- */
.book-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.book-sum div { background: var(--white); border-radius: 16px; padding: 8px; text-align: center; box-shadow: 0 3px 0 var(--line); }
.book-sum small { display: block; font-size: 11px; color: var(--ink-2); }
.book-sum b { font-family: var(--f-pop); font-weight: 400; font-size: 22px; color: var(--night-2); font-variant-numeric: tabular-nums; }
.empty-note { text-align: center; color: var(--ink-2); font-size: 12px; padding: 14px 10px 0; }

/* ---------- battle ---------- */
#battle { background: var(--cream); }
.arena { position: relative; flex: 1; min-height: 0; overflow: hidden; background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 58%, var(--grass1) 58%, var(--grass2) 100%); }
.arena .hill { position: absolute; border-radius: 50%; background: rgba(255,255,255,.3); }
.arena.night .hill { background: rgba(255,255,255,.12); }
.arena .floor { position: absolute; border-radius: 50%; background: rgba(46, 38, 87, .16); box-shadow: inset 0 -6px 0 rgba(255,255,255,.35); }
.fighter { position: absolute; transition: transform .25s, opacity .4s, filter .2s; }
.fighter svg { width: 100%; height: auto; display: block; overflow: visible; }
#foeSpr { width: 36%; right: 6%; top: 12%; }
#plySpr { width: 42%; left: 6%; bottom: 3%; }
#plySpr .flip { transform: scaleX(-1); }
.fl-foe { width: 42%; height: 9%; right: 3%; top: 41%; }
.fl-ply { width: 50%; height: 10%; left: 2%; bottom: 1%; }
.lunge-r { animation: lungeR .35s ease-out; } .lunge-l { animation: lungeL .35s ease-out; }
@keyframes lungeR { 40% { transform: translate(22%, -18%) scale(1.06); } }
@keyframes lungeL { 40% { transform: translate(-22%, 18%) scale(1.06); } }
.hurt { animation: hurt .5s steps(1); }
@keyframes hurt { 0%,40%,80% { opacity: .2; transform: translateX(-6px); } 20%,60%,100% { opacity: 1; transform: translateX(6px); } }
.faint { opacity: 0; transform: translateY(40%) scale(.7); }
.enter-l { animation: enterL .6s cubic-bezier(.2,1.4,.4,1) both; } .enter-r { animation: enterR .6s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes enterL { from { transform: translateX(-130%); } } @keyframes enterR { from { transform: translateX(130%); } }
.glow-up { animation: glowUp .7s; } @keyframes glowUp { 50% { filter: drop-shadow(0 0 14px #FFE58A) brightness(1.15); } }
.glow-heal { animation: glowHeal .8s; } @keyframes glowHeal { 50% { filter: drop-shadow(0 0 16px #8FF0C8) brightness(1.1); } }

.hud { position: absolute; z-index: 4; background: var(--white); border-radius: 18px; padding: 8px 12px 6px; width: 54%; box-shadow: 0 4px 0 rgba(46,38,87,.2); font-size: 13px; }
#foeHud { left: 4%; top: 5%; }
#plyHud { right: 4%; bottom: 25%; }
.hud .hn { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.hud .hn b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hud .lv { font-size: 12px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

@keyframes dmg { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0; } 20% { transform: translate(-50%, -20px) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -60px) scale(1); opacity: 0; } }

@keyframes pt { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(var(--r)); opacity: 0; } }
.flash { position: absolute; inset: 0; z-index: 7; background: var(--white); opacity: 0; pointer-events: none; }

.panel { flex: none; background: var(--white); border-top: 4px solid var(--lav-l); padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }

.mv .eff.weak { background: #8C7FA0; }

.panel-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; color: var(--ink-2); gap: 8px; }
.foot-btns { display: flex; gap: 4px; }

.swap-list { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 4px; }

.sw-info small { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ---------- reward / card ---------- */
.reward { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; color: var(--white); width: 100%; max-width: 360px; margin: auto; }
.reward h3 { margin: 0; font-family: var(--f-pop); font-weight: 400; font-size: 24px; line-height: 1.35; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-wrap: balance; }

  background: linear-gradient(160deg, var(--cc) 0%, var(--white) 55%, #E9DDFF 120%);

.zc-txt { font-size: 12px; line-height: 1.6; margin-top: 6px; font-weight: 500; }
.shine { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.9) 45%, rgba(255,200,240,.6) 50%, rgba(180,230,255,.6) 55%, transparent 70%);
