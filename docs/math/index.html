<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かずブロックのさんすうランド</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one-screen playroom on graph paper — header, a white "stage" where the blocks act out the problem, three big answer buttons below */
:root{
  --sky:#E9F5FF;
  --grid:#D3E8F8;
  --paper:#FFFFFF;
  --ink:#2B3A55;
  --ink-soft:#647596;
  --line:#CFE0F0;
  --sun:#FFC93C;
  --good:#2FB463;
  --oops:#FF7A59;
  --display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --c:clamp(16px,4.6vw,30px);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--body);
  color:var(--ink);
  background-color:var(--sky);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

.app{
  max-width:760px;margin:0 auto;min-height:100%;
  display:flex;flex-direction:column;gap:16px;
  padding-block:14px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.screen{display:flex;flex-direction:column;gap:16px;flex:1}

/* ---------- block buddies ---------- */
.bud{position:relative;display:inline-flex;flex-direction:column;align-items:center}
.bud .grid{
  display:grid;grid-auto-flow:column;grid-auto-columns:var(--c);
  gap:3px;transform:scaleY(-1);
}
.cube{
  --col:#ccc;
  position:relative;width:var(--c);height:var(--c);
  transform:scaleY(-1);
  background:var(--col);
  border:2px solid rgba(30,40,70,.22);
  border-radius:calc(var(--c)*.2);
  box-shadow:inset 0 calc(var(--c)*-.14) 0 rgba(0,0,0,.13),inset 0 calc(var(--c)*.1) 0 rgba(255,255,255,.4);
  transition:opacity .3s,transform .3s;
}
.cube.white{border-color:#EF4B4B}
.cube.ghost{background:transparent;border:2px dashed var(--ink-soft);box-shadow:none;opacity:.55}
.cube.face::before{
  content:"";position:absolute;left:18%;right:18%;top:26%;height:30%;
  background:
    radial-gradient(circle at 22% 50%,var(--ink) 0 calc(var(--c)*.08),transparent calc(var(--c)*.09)),
    radial-gradient(circle at 78% 50%,var(--ink) 0 calc(var(--c)*.08),transparent calc(var(--c)*.09));
}
.cube.face::after{
  content:"";position:absolute;left:34%;width:32%;top:56%;height:16%;
  border:2px solid var(--ink);border-top:0;border-radius:0 0 999px 999px;
}
.cube .num{
  display:none;position:absolute;inset:0;place-items:center;
  font-family:var(--display);font-weight:800;font-size:calc(var(--c)*.52);
  color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff;
}
.bud.hint .cube .num{display:grid}
.bud.hint .cube.face::before,.bud.hint .cube.face::after{display:none}

.mystery{
  width:calc(var(--c)*2.2);height:calc(var(--c)*2.2);
  display:grid;place-items:center;
  border:3px dashed var(--ink-soft);border-radius:18px;
  font-family:var(--display);font-weight:800;font-size:calc(var(--c)*1.3);color:var(--ink-soft);
  background:rgba(255,255,255,.6);
  animation:wobble 2.4s ease-in-out infinite;
}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-22px) scale(1.06,.95)}60%{transform:translateY(0) scale(1.05,.92)}100%{transform:translateY(0) scale(1)}}
@keyframes popin{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.popin{animation:popin .45s cubic-bezier(.2,.9,.3,1.3) both}
.hop{animation:hop .7s ease-out 2}

/* ---------- home ---------- */
.title{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px}
.title small{font-family:var(--display);font-weight:800;font-size:clamp(16px,4.2vw,22px);color:var(--ink-soft);letter-spacing:.12em}
.tiles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tile{
  width:clamp(38px,10.5vw,58px);height:clamp(38px,10.5vw,58px);
  display:grid;place-items:center;border-radius:14px;
  font-family:var(--display);font-weight:800;font-size:clamp(22px,6.4vw,34px);color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.18);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),inset 0 4px 0 rgba(255,255,255,.35),0 4px 0 rgba(30,40,70,.12);
  border:2px solid rgba(30,40,70,.18);
  animation:popin .5s cubic-bezier(.2,.9,.3,1.3) both;
}
.tile.dark{color:var(--ink);text-shadow:none}

.hello{display:flex;align-items:flex-end;justify-content:center;gap:12px}
.speech{
  position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:20px;
  padding:10px 16px;font-family:var(--display);font-weight:800;font-size:clamp(16px,4.4vw,21px);
  max-width:min(70vw,360px);text-wrap:balance;margin-bottom:calc(var(--c)*1.4);
}
.speech::after{
  content:"";position:absolute;right:-14px;bottom:14px;width:18px;height:18px;
  background:var(--paper);border-right:3px solid var(--ink);border-top:3px solid var(--ink);
  transform:rotate(45deg) skew(10deg,10deg);
}
.namebtn{
  display:block;margin-top:4px;border:0;background:none;padding:0;
  font-family:var(--body);font-weight:500;font-size:12px;color:var(--ink-soft);text-decoration:underline;
}
.namebox{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.namebox input{
  font:inherit;font-size:18px;padding:8px 12px;border-radius:12px;border:3px solid var(--line);
  width:min(220px,60vw);background:var(--paper);color:var(--ink);
}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mode{
  --col:#ccc;
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;
  background:var(--paper);border:3px solid var(--col);border-radius:22px;
  padding:14px 14px 16px;min-height:150px;position:relative;overflow:hidden;
  box-shadow:0 6px 0 var(--col);
  transition:transform .12s,box-shadow .12s;
}
.mode:active{transform:translateY(5px);box-shadow:0 1px 0 var(--col)}
.mode .mlabel{font-family:var(--display);font-weight:800;font-size:clamp(20px,5.4vw,26px)}
.mode .msub{font-size:14px;color:var(--ink-soft);font-weight:700}
.mode .msample{font-family:var(--display);font-weight:800;font-size:18px;margin-top:auto;letter-spacing:.04em}
.mode .bud{position:absolute;right:12px;bottom:12px;--c:16px}

.shelf{
  background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:14px 16px 16px;
  display:flex;flex-direction:column;gap:10px;
}
.shelf-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.shelf-head h2{margin:0;font-family:var(--display);font-weight:800;font-size:18px}
.starcount{font-family:var(--display);font-weight:800;font-size:16px;display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.friends{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;--c:11px;min-height:70px}
.friend{display:flex;flex-direction:column;align-items:center;gap:4px}
.friend b{font-family:var(--display);font-size:13px;color:var(--ink-soft)}
.friend.locked .cube{--col:#E3EAF2 !important;border-color:#D0DAE6 !important}
.friend.locked .cube.face::before,.friend.locked .cube.face::after{opacity:.25}
.shelf p{margin:0;font-size:14px;color:var(--ink-soft);font-weight:700}

.toggles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.toggle{
  display:inline-flex;align-items:center;gap:6px;
  border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;
  font-weight:700;font-size:15px;
}
.toggle[aria-pressed="false"]{opacity:.55}
.toggle svg{width:18px;height:18px}

/* ---------- quiz ---------- */
.bar{display:flex;align-items:center;gap:10px}
.back{
  border:3px solid var(--line);background:var(--paper);border-radius:14px;
  padding:6px 12px;font-weight:700;font-size:15px;flex-shrink:0;
}
.dots{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,.8);border:2px solid var(--line)}
.dot.now{border-color:var(--ink);transform:scale(1.15)}
.dot.star{background:var(--sun);border-color:#E3A90E}
.dot.ok{background:#BFE8CF;border-color:#8FD0A8}
.bar .starcount{flex-shrink:0}

.stage{
  background:var(--paper);border:3px solid var(--line);border-radius:28px;
  padding:18px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;
  box-shadow:0 8px 0 rgba(43,58,85,.06);
}
.scene{
  display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,2vw,14px);flex-wrap:wrap;
  min-height:calc(var(--c)*5 + 24px);
}
.op{font-family:var(--display);font-weight:800;font-size:calc(var(--c)*1.5);align-self:center;color:var(--ink-soft);line-height:1}
.groups{display:flex;gap:clamp(6px,2vw,12px);align-items:flex-end}
.caption{font-weight:700;font-size:clamp(15px,4vw,18px);color:var(--ink-soft);text-align:center;margin:-4px 0 0}
.eq{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,46px);line-height:1;
}
.chip{
  --col:#ccc;min-width:1.4em;padding:.12em .28em;border-radius:.3em;text-align:center;
  background:var(--col);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);
  box-shadow:inset 0 -.12em 0 rgba(0,0,0,.14);border:2px solid rgba(30,40,70,.18);
  font-variant-numeric:tabular-nums;
}
.chip.dark{color:var(--ink);text-shadow:none}
.chip.white{border-color:#EF4B4B}
.chip.q{background:transparent;border:3px dashed var(--ink-soft);color:var(--ink-soft);box-shadow:none;text-shadow:none}
.eq .sym{color:var(--ink-soft)}

.message{
  min-height:1.6em;text-align:center;font-family:var(--display);font-weight:800;
  font-size:clamp(20px,5.6vw,28px);
}
.message.good{color:var(--good)}
.message.oops{color:var(--oops);font-size:clamp(16px,4.4vw,21px)}

.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.choice{
  --col:#ccc;
  min-height:96px;border-radius:24px;border:3px solid rgba(30,40,70,.2);
  background:var(--col);color:#fff;
  font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,58px);
  text-shadow:0 3px 0 rgba(0,0,0,.2);
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.14),inset 0 5px 0 rgba(255,255,255,.35),0 6px 0 rgba(30,40,70,.18);
  transition:transform .1s,box-shadow .1s,opacity .2s;
  font-variant-numeric:tabular-nums;
}
.choice.dark{color:var(--ink);text-shadow:none}
.choice.white{border-color:#EF4B4B}
.choice:active{transform:translateY(5px);box-shadow:inset 0 -8px 0 rgba(0,0,0,.14),0 1px 0 rgba(30,40,70,.18)}
.choice.wrong{animation:shake .45s;opacity:.3;filter:grayscale(.8)}
.choice.right{outline:5px solid var(--good);outline-offset:3px}
.choice:disabled{cursor:default}

/* ---------- result ---------- */
.result{align-items:center;text-align:center;justify-content:center}
.result h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,44px);text-wrap:balance}
.bigstars{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:420px}
.bigstars svg{width:clamp(26px,7.5vw,36px);height:clamp(26px,7.5vw,36px)}
.bigstars .off path{fill:#E3EAF2;stroke:#D0DAE6}
.score{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.newfriend{
  background:var(--paper);border:3px solid var(--sun);border-radius:22px;padding:14px 18px;
  display:flex;flex-direction:column;align-items:center;gap:8px;--c:22px;
}
.newfriend b{font-family:var(--display);font-size:18px}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{
  border:3px solid rgba(30,40,70,.2);border-radius:18px;padding:14px 24px;
  font-family:var(--display);font-weight:800;font-size:20px;
  background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #D9A21A;
}
.btn.ghostbtn{background:var(--paper);box-shadow:0 5px 0 var(--line);border-color:var(--line)}
.btn:active{transform:translateY(4px);box-shadow:none}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}

@media (max-width:380px){
  .choice{min-height:84px}
  .mode{min-height:136px;padding:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="app">

  <!-- HOME -->
  <section class="screen" id="home">
    <div class="title">
      <small>かずブロックの</small>
      <div class="tiles" id="titleTiles" aria-label="さんすうランド"></div>
    </div>

    <div class="hello">
      <div class="speech" id="greet">あそぼう！ どれに する？</div>
      <div id="mascot"></div>
    </div>
    <div class="namebox" id="nameBox" hidden>
      <input id="nameInput" maxlength="10" placeholder="なまえ（ひらがな）" autocomplete="off">
      <button class="back" id="nameSave" type="button">きめた</button>
    </div>

    <div class="modes" id="modes"></div>

    <div class="shelf">
      <div class="shelf-head">
        <h2>あつめた なかま</h2>
        <span class="starcount"><span class="staricon"></span><span id="totalStars">0</span></span>
      </div>
      <div class="friends" id="friends"></div>
      <p id="nextFriend"></p>
    </div>

    <div class="toggles">
      <button class="toggle" id="sndToggle" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        おと
      </button>
      <button class="toggle" id="voiceToggle" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"/></svg>
        よみあげ
      </button>
      <button class="toggle" id="nameToggle" type="button" aria-pressed="true">なまえ</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="quiz" hidden>
    <div class="bar">
      <button class="back" id="quitBtn" type="button">もどる</button>
      <div class="dots" id="dots"></div>
      <span class="starcount"><span class="staricon"></span><span id="roundStars">0</span></span>
    </div>

    <div class="stage">
      <div class="scene" id="scene"></div>
      <p class="caption" id="caption" hidden></p>
      <div class="eq" id="eq" aria-live="polite"></div>
    </div>

    <div class="message" id="msg" aria-live="polite"></div>
    <div class="choices" id="choices"></div>
  </section>

  <!-- RESULT -->
  <section class="screen result" id="result" hidden>
    <h2 id="resTitle">よく できました！</h2>
    <div class="bigstars" id="bigStars"></div>
    <div class="score" id="resScore"></div>
    <div id="resNew"></div>
    <div class="actions">
      <button class="btn" id="againBtn" type="button">もういちど</button>
      <button class="btn ghostbtn" id="menuBtn" type="button">メニューへ</button>
    </div>
  </section>
</div>

<script>
(() => {
  // ---------- colors: one hue per number, 7 is a rainbow, 10 is white with red edges ----------
  const COL = {1:'#EF4B4B',2:'#FF9A2E',3:'#FFD23F',4:'#5CC45C',5:'#3BB8EB',6:'#9B6BE0',8:'#F06BB0',9:'#9AA6B4',10:'#FFFFFF'};
  const RAINBOW = ['#EF4B4B','#FF9A2E','#FFD23F','#5CC45C','#3BB8EB','#4F6BE0','#9B6BE0'];
  const DARK_TEXT = new Set([2,3,9,10]);
  const base = n => (n > 10 ? (n % 10 || 10) : n);
  const mainColor = n => n === 0 ? '#E3EAF2' : base(n) === 7 ? '#5CC45C' : COL[base(n)];
  function cubeColor(n, i){
    if (n > 10){ if (i < 10) return COL[10]; n -= 10; i -= 10; }
    return n === 7 ? RAINBOW[i] : COL[n];
  }
  function paint(elm, n){
    if (base(n) === 7 && n > 0) elm.style.background = 'linear-gradient(135deg,#EF4B4B,#FF9A2E,#FFD23F,#5CC45C,#3BB8EB,#9B6BE0)';
    elm.style.setProperty('--col', mainColor(n));
    if (DARK_TEXT.has(base(n)) || n === 0) elm.classList.add('dark');
    if (base(n) === 10 && n > 0) elm.classList.add('white');
  }

  const $ = id => document.getElementById(id);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // A block buddy: n cubes stacked in towers of up to 5, face on the top of the first tower.
  function bud(n, {ghost = 0, hint = false, start = 1, face = true} = {}){
    const wrap = el('div', 'bud');
    const g = el('div', 'grid');
    const rows = Math.max(1, Math.min(n, 5));
    g.style.gridTemplateRows = `repeat(${rows}, var(--c))`;
    for (let i = 0; i < n; i++){
      const c = el('div', 'cube');
      const col = cubeColor(n, i);
      c.style.setProperty('--col', col);
      if (col === COL[10]) c.classList.add('white');
      const gone = i >= n - ghost;
      if (gone) c.classList.add('ghost');
      if (face && i === rows - 1 && !(gone && ghost >= n)) c.classList.add('face');
      c.append(el('span', 'num', gone ? '' : String(start + i)));
      g.append(c);
    }
    wrap.append(g);
    if (hint) wrap.classList.add('hint');
    return wrap;
  }

  const STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z" fill="#FFC93C" stroke="#E3A90E" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  document.querySelectorAll('.staricon').forEach(s => { s.innerHTML = STAR_SVG; s.firstChild.style.cssText = 'width:20px;height:20px'; });

  // ---------- storage (per-device, optional) ----------
  const store = {
    get(k, d){ try { const v = localStorage.getItem('kazublock:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v){ try { localStorage.setItem('kazublock:' + k, JSON.stringify(v)); } catch {} }
  };
  let totalStars = store.get('stars', 0);
  let soundOn = store.get('sound', true);
  let voiceOn = store.get('voice', true);
  let kidName = store.get('name', '');
  const STARS_PER_FRIEND = 5;

  // ---------- sound ----------
  let ac = null;
  function audio(){
    if (!soundOn) return null;
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch { ac = null; }
    return ac;
  }
  function tone(f, t0, dur, type = 'triangle', vol = .14){
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f;
    const t = a.currentTime + t0;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
  }
  const sfx = {
    tap(){ tone(880, 0, .06, 'sine', .06); },
    good(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .08, .22)); },
    oops(){ tone(392, 0, .16, 'sine', .1); tone(311, .14, .26, 'sine', .1); },
    fanfare(){ [523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, i * .13, .24, 'square', .05)); }
  };

  // ---------- voice ----------
  let jaVoice = null;
  function loadVoice(){ try { jaVoice = speechSynthesis.getVoices().find(v => /ja/i.test(v.lang)) || null; } catch {} }
  try { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; } catch {}
  function say(text){
    if (!voiceOn) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice;
      u.rate = .9; u.pitch = 1.25;
      speechSynthesis.speak(u);
    } catch {}
  }

  // ---------- confetti ----------
  const cv = $('confetti'), cx = cv.getContext('2d');
  let parts = [], raf = 0;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function confetti(count = 60){
    if (reduced) return;
    cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    const colors = RAINBOW.concat(['#F06BB0', '#FFFFFF']);
    for (let i = 0; i < count; i++){
      parts.push({x: innerWidth * (.2 + Math.random() * .6), y: innerHeight * .45, vx: (Math.random() - .5) * 12, vy: -6 - Math.random() * 9,
        s: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: pick(colors), life: 0});
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick(){
    const d = devicePixelRatio;
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 220);
    for (const p of parts){
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      cx.save(); cx.translate(p.x * d, p.y * d); cx.rotate(p.r);
      cx.fillStyle = p.c; cx.strokeStyle = 'rgba(30,40,70,.25)'; cx.lineWidth = 1.5 * d;
      cx.fillRect(-p.s * d / 2, -p.s * d / 2, p.s * d, p.s * d); cx.strokeRect(-p.s * d / 2, -p.s * d / 2, p.s * d, p.s * d);
      cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
    if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
  }

  // ---------- modes ----------
  const MODES = {
    add10: {label: 'たしざん', sub: 'こたえが 10まで', icon: 3, sample: '3 + 4',
      gen(){ const s = rand(2, 10), a = rand(1, s - 1); return {op: '+', a, b: s - a, ans: s}; }},
    add20: {label: 'たしざん', sub: 'こたえが 20まで', icon: 5, sample: '8 + 6',
      gen(){ const a = rand(2, 10), b = rand(Math.max(1, 11 - a), 10); return {op: '+', a, b, ans: a + b}; }},
    sub10: {label: 'ひきざん', sub: '10までの かず', icon: 4, sample: '7 − 2',
      gen(){ const a = rand(2, 10), b = rand(1, a - 1); return {op: '−', a, b, ans: a - b}; }},
    mul:   {label: 'かけざん', sub: '1〜5の だん', icon: 6, sample: '2 × 3',
      gen(){ const a = rand(1, 5), b = rand(1, 5); return {op: '×', a, b, ans: a * b}; }}
  };
  const SPOKEN = {'+': 'たす', '−': 'ひく', '×': 'かける'};
  const PRAISE = ['せいかい！', 'すごい！', 'やったね！', 'ばっちり！', 'てんさい！', 'かんぺき！'];
  const ROUND = 10;

  let state = null;

  function choicesFor(q){
    const opts = new Set([q.ans]);
    const pool = shuffle([q.ans + 1, q.ans - 1, q.ans + 2, q.ans - 2, q.op === '×' ? q.a * (q.b + 1) : q.ans + 3,
      q.op === '×' ? q.a + q.b : q.ans - 3, q.op === '×' ? q.a * (q.b - 1) : q.ans + 4]);
    for (const n of pool){ if (opts.size >= 3) break; if (n >= (q.op === '−' ? 0 : 1) && n <= 30) opts.add(n); }
    let k = 1; while (opts.size < 3) opts.add(q.ans + k++);
    return shuffle([...opts]);
  }

  function chip(n){ const c = el('span', 'chip', String(n)); paint(c, n); return c; }

  function renderScene(hint){
    const q = state.q, sc = $('scene');
    sc.replaceChildren();
    const cap = $('caption'); cap.hidden = true;
    if (q.op === '+'){
      sc.append(bud(q.a, {hint}), el('span', 'op', '+'), bud(q.b, {hint, start: q.a + 1}));
    } else if (q.op === '−'){
      sc.append(bud(q.a, {hint, ghost: q.b}));
      cap.hidden = false; cap.textContent = `${q.a}こ から ${q.b}こ ばいばい`;
    } else {
      const gr = el('div', 'groups');
      for (let k = 0; k < q.b; k++) gr.append(bud(q.a, {hint, start: k * q.a + 1}));
      sc.append(gr);
      cap.hidden = false; cap.textContent = `${q.a} が ${q.b}こ ぶん`;
    }
    sc.append(el('span', 'op', '='));
    if (state.solved){
      const ans = q.ans === 0 ? el('div', 'mystery', '0') : bud(q.ans);
      ans.classList.add('popin'); sc.append(ans);
      requestAnimationFrame(() => ans.classList.add('hop'));
    } else sc.append(el('div', 'mystery', '?'));
  }

  function renderEq(){
    const q = state.q, eq = $('eq');
    eq.replaceChildren(chip(q.a), el('span', 'sym', q.op), chip(q.b), el('span', 'sym', '='));
    if (state.solved) { const c = chip(q.ans); c.classList.add('popin'); eq.append(c); }
    else eq.append(el('span', 'chip q', '?'));
  }

  function renderDots(){
    const d = $('dots'); d.replaceChildren();
    for (let i = 0; i < ROUND; i++){
      const dot = el('span', 'dot');
      if (i < state.results.length) dot.classList.add(state.results[i] ? 'star' : 'ok');
      else if (i === state.i) dot.classList.add('now');
      d.append(dot);
    }
    $('roundStars').textContent = state.stars;
  }

  function nextQuestion(){
    if (state.i >= ROUND) return showResult();
    let q, key, tries = 0;
    do { q = MODES[state.mode].gen(); key = q.a + q.op + q.b; } while (state.used.has(key) && ++tries < 30);
    state.used.add(key);
    Object.assign(state, {q, solved: false, firstTry: true, locked: false});
    renderScene(false); renderEq(); renderDots();
    $('msg').textContent = ''; $('msg').className = 'message';
    const ch = $('choices'); ch.replaceChildren();
    for (const n of choicesFor(q)){
      const b = el('button', 'choice', String(n)); b.type = 'button'; paint(b, n);
      b.setAttribute('aria-label', `${n}`);
      b.addEventListener('click', () => answer(n, b));
      ch.append(b);
    }
    say(`${q.a} ${SPOKEN[q.op]} ${q.b} は？`);
  }

  function answer(n, btn){
    if (state.locked) return;
    const q = state.q, msg = $('msg');
    if (n === q.ans){
      state.locked = true; state.solved = true;
      if (state.firstTry) state.stars++;
      state.results.push(state.firstTry);
      btn.classList.add('right');
      [...$('choices').children].forEach(b => b.disabled = true);
      renderScene(false); renderEq();
      const p = state.firstTry ? pick(PRAISE) : 'できたね！';
      msg.textContent = p; msg.className = 'message good';
      sfx.good(); confetti(state.firstTry ? 50 : 24);
      say(`${p} ${q.ans}`);
      state.i++; renderDots();
      state.timer = setTimeout(nextQuestion, 1900);
    } else {
      state.firstTry = false;
      btn.classList.add('wrong'); btn.disabled = true;
      renderScene(true);
      const tip = q.op === '−' ? 'のこった ブロックを かぞえてみよう' : 'ブロックを かぞえてみよう';
      msg.textContent = `おしい！ ${tip}`; msg.className = 'message oops';
      sfx.oops(); say(`おしい！ ${tip}`);
    }
  }

  function startRound(mode){
    if (state) clearTimeout(state.timer);
    state = {mode, i: 0, stars: 0, results: [], used: new Set()};
    show('quiz'); nextQuestion();
  }

  function showResult(){
    const before = Math.floor(totalStars / STARS_PER_FRIEND);
    totalStars += state.stars; store.set('stars', totalStars);
    const after = Math.floor(totalStars / STARS_PER_FRIEND);
    const s = state.stars;
    $('resTitle').textContent = s === ROUND ? 'ぜんもん せいかい！' : s >= 7 ? 'すごい！ よく できました！' : s >= 4 ? 'がんばったね！' : 'たくさん かぞえたね！';
    $('resScore').textContent = `ほし ${s} / ${ROUND}`;
    const bs = $('bigStars'); bs.replaceChildren();
    state.results.forEach(r => { const w = el('span', r ? '' : 'off'); w.innerHTML = STAR_SVG; bs.append(w); });
    const nf = $('resNew'); nf.replaceChildren();
    if (after > before && before < 10){
      const k = Math.min(after, 10);
      const box = el('div', 'newfriend');
      box.append(el('b', '', `あたらしい なかま「${k}」が きたよ！`));
      const bd = bud(k); bd.classList.add('popin', 'hop'); box.append(bd);
      nf.append(box);
    }
    show('result'); sfx.fanfare(); confetti(120);
    say($('resTitle').textContent);
  }

  // ---------- home ----------
  function renderHome(){
    const tt = $('titleTiles'); tt.replaceChildren();
    [...'さんすうランド'].forEach((ch, i) => {
      const t = el('span', 'tile', ch); t.style.background = RAINBOW[i];
      if (i === 2) t.classList.add('dark');
      t.style.animationDelay = (i * 70) + 'ms'; tt.append(t);
    });
    const m = $('mascot'); m.replaceChildren(); const mb = bud(3); mb.classList.add('hop'); m.append(mb);
    renderGreeting();

    const ms = $('modes'); ms.replaceChildren();
    for (const [key, md] of Object.entries(MODES)){
      const b = el('button', 'mode'); b.type = 'button';
      b.style.setProperty('--col', mainColor(md.icon));
      b.append(el('span', 'mlabel', md.label), el('span', 'msub', md.sub), el('span', 'msample', md.sample), bud(md.icon));
      b.addEventListener('click', () => { sfx.tap(); startRound(key); });
      ms.append(b);
    }

    $('totalStars').textContent = totalStars;
    const fr = $('friends'); fr.replaceChildren();
    const have = Math.min(10, Math.floor(totalStars / STARS_PER_FRIEND));
    for (let k = 1; k <= 10; k++){
      const f = el('div', 'friend' + (k > have ? ' locked' : ''));
      f.append(bud(k), el('b', '', k > have ? '?' : String(k)));
      fr.append(f);
    }
    $('nextFriend').textContent = have >= 10
      ? 'なかまが ぜんいん そろったよ！'
      : `ほしを あと ${STARS_PER_FRIEND * (have + 1) - totalStars}こ あつめると「${have + 1}」が なかまに なるよ`;
  }
  function renderGreeting(){
    const g = $('greet');
    g.textContent = kidName ? `${kidName}ちゃん、あそぼう！ どれに する？` : 'あそぼう！ どれに する？';
  }

  function show(id){
    for (const s of ['home', 'quiz', 'result']) $(s).hidden = s !== id;
    if (id === 'home') renderHome();
    scrollTo(0, 0);
  }

  // ---------- wiring ----------
  function syncToggles(){
    $('sndToggle').setAttribute('aria-pressed', soundOn);
    $('voiceToggle').setAttribute('aria-pressed', voiceOn);
  }
  $('sndToggle').addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); syncToggles(); sfx.tap(); });
  $('voiceToggle').addEventListener('click', () => { voiceOn = !voiceOn; store.set('voice', voiceOn); syncToggles(); if (voiceOn) say('よみあげ するよ'); else try { speechSynthesis.cancel(); } catch {} });
  $('nameToggle').addEventListener('click', () => { const nb = $('nameBox'); nb.hidden = !nb.hidden; if (!nb.hidden){ $('nameInput').value = kidName; $('nameInput').focus(); } });
  function saveName(){ kidName = $('nameInput').value.trim().slice(0, 10); store.set('name', kidName); $('nameBox').hidden = true; renderGreeting(); if (kidName) say(`${kidName}ちゃん、よろしくね`); }
  $('nameSave').addEventListener('click', saveName);
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); });
  $('quitBtn').addEventListener('click', () => { clearTimeout(state && state.timer); try { speechSynthesis.cancel(); } catch {} show('home'); });
  $('againBtn').addEventListener('click', () => startRound(state.mode));
  $('menuBtn').addEventListener('click', () => show('home'));

  syncToggles();
  show('home');
})();
</script>
</body>
</html>
