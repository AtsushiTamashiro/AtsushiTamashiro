<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゆるっと!ご当地バトル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="47都道府県のご当地ゆるキャラが戦う、かわいいバトルゲーム。勝ってご当地カードを集めよう。">
<meta name="theme-color" content="#FFD6E4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: スマホ縦1画面のゲーム機。デスクトップではドット柄の上に浮かぶ1台。 */
:root {
  --pink: #FF7BA9; --pink-d: #E25A8C; --pink-l: #FFD6E4;
  --cream: #FFF8F1; --butter: #FFE58A; --mint: #8FDCC4; --sky: #A9DCFF; --lav: #CDBBFF;
  --ink: #5B3A4A; --ink-2: #8C6B7B; --white: #FFFFFF;
  --f-pop: "Mochiy Pop One", "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
  --f-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--f-body); font-weight: 700;
  background-color: var(--pink-l);
  background-image: radial-gradient(circle, rgba(255,255,255,.85) 3.5px, transparent 4px), radial-gradient(circle, rgba(255,255,255,.85) 3.5px, transparent 4px);
  background-size: 34px 34px; background-position: 0 0, 17px 17px;
  user-select: none; -webkit-user-select: none; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
#app {
  position: relative; height: 100%; max-width: 460px; margin: 0 auto; overflow: hidden;
  background: var(--cream); box-shadow: 0 0 0 4px var(--white), 0 20px 60px rgba(150, 60, 100, .25);
}
@media (min-width: 520px) and (min-height: 760px) {
  #app { height: calc(100% - 40px); margin-top: 20px; border-radius: 34px; max-height: 920px; }
}
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); -webkit-overflow-scrolling: touch; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--f-pop); font-weight: 400; font-size: 18px; letter-spacing: .04em;
  padding: 14px 24px; border-radius: 999px; color: var(--white); background: var(--pink);
  box-shadow: 0 5px 0 var(--pink-d), 0 9px 16px rgba(226, 90, 140, .3);
  transition: transform .08s, box-shadow .08s; text-shadow: 0 2px 0 rgba(0,0,0,.08);
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-d), 0 3px 8px rgba(226, 90, 140, .3); }
.btn.sub { background: var(--white); color: var(--pink-d); box-shadow: 0 5px 0 #F2C2D3, 0 9px 16px rgba(226, 90, 140, .15); }
.btn.sub:active { box-shadow: 0 1px 0 #F2C2D3; }
.btn.mint { background: #5FC9A9; box-shadow: 0 5px 0 #3FA587, 0 9px 16px rgba(63, 165, 135, .3); }
.btn.gold { background: linear-gradient(180deg, #FFD46B, #FFB43B); color: #7A4A10; box-shadow: 0 5px 0 #D98E1E, 0 9px 16px rgba(217,142,30,.35); }
.btn.small { font-size: 14px; padding: 9px 16px; box-shadow: 0 4px 0 #F2C2D3; }
.btn[disabled] { filter: grayscale(.8); opacity: .55; pointer-events: none; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 50%; background: var(--white); font-size: 20px;
  display: grid; place-items: center; box-shadow: 0 3px 0 #F2C2D3;
}

/* ---------- title ---------- */
#title { background: linear-gradient(180deg, #BEE6FF 0%, #FFE3EE 62%, #FFF8F1 100%); align-items: center; justify-content: center; text-align: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); gap: 6px; }
.cloud { position: absolute; background: var(--white); border-radius: 999px; opacity: .9; animation: drift linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
.cloud::before { width: 55%; height: 160%; left: 15%; bottom: 20%; }
.cloud::after { width: 40%; height: 130%; right: 12%; bottom: 25%; }
@keyframes drift { from { transform: translateX(-140px); } to { transform: translateX(620px); } }
.logo-wrap { position: relative; z-index: 2; margin-top: -10px; }
.logo-small { font-family: var(--f-pop); color: var(--white); background: var(--pink); display: inline-block; padding: 6px 16px; border-radius: 999px; font-size: 15px; transform: rotate(-4deg); box-shadow: 0 3px 0 var(--pink-d); }
.logo {
  font-family: var(--f-pop); font-weight: 400; font-size: clamp(38px, 11vw, 52px); line-height: 1.15; margin: 10px 0 0; color: var(--white);
  -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; letter-spacing: .02em;
  text-shadow: 0 6px 0 var(--ink);
}
.logo .l1 { color: #FFE58A; } .logo .l2 { color: #FF9DC0; }
.title-charas { position: relative; height: 170px; width: 100%; max-width: 380px; margin: 4px auto 6px; z-index: 2; }
.title-charas .tc { position: absolute; bottom: 0; }
.title-charas .tc svg { width: 100%; height: auto; display: block; }
.title-menu { display: flex; flex-direction: column; gap: 14px; width: min(280px, 100%); z-index: 2; }
.title-note { font-size: 12px; color: var(--ink-2); margin-top: 8px; z-index: 2; }

.bounce { animation: bounce 1.6s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes bounce { 0%,100% { transform: translateY(0) scale(1, 1); } 45% { transform: translateY(-8px) scale(.98, 1.03); } 55% { transform: translateY(-8px); } 85% { transform: translateY(0) scale(1.04, .96); } }

/* ---------- header bar ---------- */
.bar { display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--white); border-bottom: 3px dashed var(--pink-l); z-index: 3; }
.bar h2 { flex: 1; margin: 0; font-family: var(--f-pop); font-weight: 400; font-size: 19px; color: var(--pink-d); text-wrap: balance; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 999px; background: var(--pink-l); color: var(--pink-d); font-size: 14px; font-variant-numeric: tabular-nums; }

/* ---------- region tabs & grids ---------- */
.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; padding: 8px 14px; border-radius: 999px; background: var(--white); font-size: 13px; color: var(--ink-2); box-shadow: 0 3px 0 #F1D9E2; white-space: nowrap; }
.tab.on { background: var(--ink); color: var(--white); box-shadow: 0 3px 0 #3B2430; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile {
  position: relative; background: var(--white); border-radius: 20px; padding: 6px 4px 8px; text-align: center;
  box-shadow: 0 4px 0 #F1D9E2; transition: transform .12s;
}
.tile:active { transform: scale(.95); }
.tile svg { width: 100%; height: auto; display: block; }
.tile .tn { font-size: 11px; color: var(--ink-2); line-height: 1.2; }
.tile .tc-name { font-size: 11.5px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.sel { box-shadow: 0 0 0 3px var(--pink), 0 4px 0 var(--pink-d); }
.tile .stamp {
  position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; background: var(--butter);
  display: grid; place-items: center; font-size: 13px; box-shadow: 0 2px 0 #E4BE4A; transform: rotate(12deg);
}
.tile .tbg { position: absolute; inset: 6px 6px auto; aspect-ratio: 1; border-radius: 16px; opacity: .35; z-index: 0; }
.tile > *:not(.tbg) { position: relative; z-index: 1; }

/* ---------- type chips ---------- */
.ty { display: inline-flex; align-items: center; gap: 3px; padding: 2px 9px 2px 6px; border-radius: 999px; font-size: 12px; color: var(--ink); background: var(--tc); white-space: nowrap; }

/* ---------- sheet (bottom modal) ---------- */
.veil { position: absolute; inset: 0; background: rgba(91, 58, 74, .45); z-index: 20; display: flex; align-items: flex-end; animation: fade .2s; }
.veil.center { align-items: center; justify-content: center; padding: 16px; background: rgba(70, 40, 58, .78); overflow-y: auto; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-height: 92%; overflow-y: auto; background: var(--cream); border-radius: 30px 30px 0 0; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); animation: up .28s cubic-bezier(.2,1.3,.4,1); }
@keyframes up { from { transform: translateY(60%); } }
.sheet-head { display: flex; gap: 14px; align-items: center; }
.sheet-art { width: 132px; flex: none; border-radius: 26px; padding: 4px; }
.sheet-art svg { width: 100%; height: auto; display: block; }
.sheet h3 { margin: 0; font-family: var(--f-pop); font-weight: 400; font-size: 24px; line-height: 1.2; }
.sheet .pref { font-size: 13px; color: var(--ink-2); }
.stats { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 8px; align-items: center; font-size: 12px; margin: 14px 0 8px; font-variant-numeric: tabular-nums; }
.stats .meter { height: 10px; border-radius: 99px; background: #F3E4EA; overflow: hidden; }
.stats .meter i { display: block; height: 100%; border-radius: 99px; background: var(--pink); }
.moves-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 18px; }
.mv-info { background: var(--white); border-radius: 16px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 3px 0 #F1D9E2; min-width: 0; }
.mv-info b { display: block; font-size: 13px; line-height: 1.3; margin-bottom: 4px; overflow-wrap: anywhere; }
.mv-info small { color: var(--ink-2); font-size: 11px; }
.sheet-actions { display: flex; gap: 10px; }
.sheet-actions .btn { flex: 1; }

/* ---------- home ---------- */
.partner-card {
  display: flex; align-items: center; gap: 12px; background: var(--white); border-radius: 28px; padding: 12px 14px;
  box-shadow: 0 5px 0 #F1D9E2; margin-bottom: 14px; position: relative; overflow: hidden;
}
.partner-card .pc-art { width: 104px; flex: none; position: relative; z-index: 1; }
.partner-card .pc-art svg { width: 100%; height: auto; display: block; }
.partner-card .pc-info { flex: 1; min-width: 0; position: relative; z-index: 1; }
.partner-card .pc-bg { position: absolute; left: -30px; top: -30px; width: 170px; height: 170px; border-radius: 50%; opacity: .35; }
.pc-name { font-family: var(--f-pop); font-size: 20px; line-height: 1.25; }
.pc-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0 8px; font-size: 13px; }
.progress { background: var(--white); border-radius: 22px; padding: 12px 14px; box-shadow: 0 4px 0 #F1D9E2; margin-bottom: 14px; }
.progress .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
.progress .big { font-family: var(--f-pop); font-size: 22px; color: var(--pink-d); font-variant-numeric: tabular-nums; }
.pbar { height: 14px; border-radius: 99px; background: #F3E4EA; overflow: hidden; margin-top: 6px; }
.pbar i { display: block; height: 100%; border-radius: 99px; background: repeating-linear-gradient(-45deg, var(--pink) 0 10px, #FF94BB 10px 20px); transition: width .6s; }
.section-title { font-family: var(--f-pop); font-size: 16px; margin: 6px 0 8px; display: flex; align-items: center; gap: 8px; }
.home-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.home-actions .btn, .sheet-actions .btn { font-size: 16px; padding: 14px 12px; white-space: nowrap; }
.world-banner {
  position: relative; border-radius: 24px; padding: 14px 16px; margin-bottom: 16px; color: var(--white); overflow: hidden;
  background: linear-gradient(120deg, #7A6CF0, #F07AB8 60%, #FFB45E); box-shadow: 0 5px 0 #5C4FC4;
}
.world-banner h4 { margin: 0 0 2px; font-family: var(--f-pop); font-weight: 400; font-size: 18px; }
.world-banner p { margin: 0 0 10px; font-size: 12.5px; opacity: .95; }
.world-banner.locked { filter: grayscale(.7); opacity: .7; }
.world-banner .globe { position: absolute; right: -6px; top: -8px; font-size: 64px; opacity: .35; }

/* ---------- battle ---------- */
#battle { background: var(--cream); }
.arena { position: relative; flex: 1; min-height: 0; overflow: hidden; background: linear-gradient(180deg, var(--sky1, #BEE6FF) 0%, var(--sky2, #FFE3EE) 58%, var(--grass1, #C9F0C0) 58%, var(--grass2, #A8E3A0) 100%); }
.arena .hill { position: absolute; border-radius: 50%; background: rgba(255,255,255,.35); }
.arena .floor { position: absolute; border-radius: 50%; background: rgba(91, 58, 74, .12); box-shadow: inset 0 -6px 0 rgba(255,255,255,.4); }
.fighter { position: absolute; transition: transform .25s, opacity .4s, filter .2s; }
.fighter svg { width: 100%; height: auto; display: block; overflow: visible; }
#foeSpr { width: 34%; right: 7%; top: 13%; }
#plySpr { width: 42%; left: 6%; bottom: 3%; }
#plySpr .flip { transform: scaleX(-1); }
.fl-foe { width: 40%; height: 9%; right: 4%; top: 40%; }
.fl-ply { width: 50%; height: 10%; left: 2%; bottom: 1%; }
.lunge-r { animation: lungeR .35s ease-out; } .lunge-l { animation: lungeL .35s ease-out; }
@keyframes lungeR { 40% { transform: translate(22%, -18%) scale(1.06); } }
@keyframes lungeL { 40% { transform: translate(-22%, 18%) scale(1.06); } }
.hurt { animation: hurt .5s steps(1); }
@keyframes hurt { 0%,40%,80% { opacity: .2; transform: translateX(-6px); } 20%,60%,100% { opacity: 1; transform: translateX(6px); } }
.faint { opacity: 0; transform: translateY(40%) scale(.7); }
.enter-l { animation: enterL .6s cubic-bezier(.2,1.4,.4,1) both; } .enter-r { animation: enterR .6s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes enterL { from { transform: translateX(-130%); } } @keyframes enterR { from { transform: translateX(130%); } }
.glow-up { animation: glowUp .7s; } @keyframes glowUp { 50% { filter: drop-shadow(0 0 14px #FFE58A) brightness(1.15); } }
.glow-heal { animation: glowHeal .8s; } @keyframes glowHeal { 50% { filter: drop-shadow(0 0 16px #8FF0C8) brightness(1.1); } }

.hud {
  position: absolute; z-index: 4; background: var(--white); border-radius: 18px; padding: 8px 12px 9px; width: 52%;
  box-shadow: 0 4px 0 rgba(91,58,74,.18); font-size: 13px;
}
#foeHud { left: 4%; top: 5%; }
#plyHud { right: 4%; bottom: 26%; }
.hud .hn { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.hud .hn b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hud .lv { font-size: 12px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hp { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
.hp span { font-size: 10px; background: var(--ink); color: var(--white); border-radius: 6px; padding: 0 5px; line-height: 16px; }
.hp .track { flex: 1; height: 11px; background: #F3E4EA; border-radius: 99px; overflow: hidden; }
.hp .track i { display: block; height: 100%; width: 100%; background: #6FD69B; border-radius: 99px; transition: width .6s ease, background-color .3s; }
.hp .track i.mid { background: #FFCB4E; } .hp .track i.low { background: #FF7B8C; }
.hpnum { text-align: right; font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stages { display: flex; gap: 4px; margin-top: 3px; min-height: 16px; }
.stages em { font-style: normal; font-size: 10px; padding: 0 6px; border-radius: 6px; line-height: 16px; background: #FFF0B8; }
.stages em.dn { background: #DCE6FF; }

.dmg { position: absolute; z-index: 6; font-family: var(--f-pop); font-size: 26px; color: var(--white); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; animation: dmg 1s ease-out forwards; pointer-events: none; }
.dmg.heal { color: #7BE8B4; }
@keyframes dmg { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0; } 20% { transform: translate(-50%, -20px) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -60px) scale(1); opacity: 0; } }
.pt { position: absolute; z-index: 5; font-size: 26px; pointer-events: none; animation: pt .8s ease-out forwards; }
@keyframes pt { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(var(--r)); opacity: 0; } }
.flash { position: absolute; inset: 0; z-index: 7; background: var(--white); opacity: 0; pointer-events: none; }
.flash.on { animation: flash .35s; } @keyframes flash { 30% { opacity: .75; } }

.panel { flex: none; background: var(--white); border-top: 4px solid var(--pink-l); padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.msg {
  min-height: 66px; border-radius: 18px; background: var(--cream); border: 3px solid var(--ink); padding: 10px 14px; font-size: 15.5px; line-height: 1.5; position: relative;
}
.msg .caret { position: absolute; right: 12px; bottom: 6px; font-size: 12px; color: var(--pink-d); animation: blink .8s infinite; }
@keyframes blink { 50% { opacity: 0; } }
.moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.mv {
  position: relative; text-align: left; padding: 9px 11px 8px; border-radius: 16px; background: var(--tc); min-height: 58px;
  box-shadow: 0 4px 0 var(--tcd); transition: transform .08s, box-shadow .08s; min-width: 0;
}
.mv:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tcd); }
.mv b { display: block; font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; }
.mv small { display: flex; justify-content: space-between; font-size: 11px; margin-top: 3px; color: rgba(91,58,74,.8); font-variant-numeric: tabular-nums; }
.mv .eff { position: absolute; top: -8px; right: 8px; font-size: 10px; padding: 1px 7px; border-radius: 99px; background: var(--ink); color: var(--white); }
.mv[disabled] { opacity: .45; pointer-events: none; }
.panel-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.panel-foot button { color: var(--ink-2); padding: 4px 6px; }

/* ---------- cards ---------- */
.card {
  position: relative; border-radius: 20px; padding: 8px; overflow: hidden; aspect-ratio: 5 / 7.4;
  background: linear-gradient(160deg, var(--cc) 0%, var(--white) 55%, var(--ca) 140%);
  box-shadow: 0 0 0 3px var(--white), 0 0 0 5px var(--ink), 0 8px 18px rgba(91,58,74,.25);
  display: flex; flex-direction: column; text-align: left; max-width: 100%; color: var(--ink);
}
.card .ctop { display: flex; justify-content: space-between; align-items: center; font-size: 10px; gap: 4px; }
.card .cno { background: var(--ink); color: var(--white); border-radius: 99px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.card .cpref { font-family: var(--f-pop); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .cart {
  margin: 5px 0; border-radius: 14px; aspect-ratio: 1.15; display: grid; place-items: center; overflow: hidden;
  background-color: var(--white); border: 2px solid var(--ink);
  background-image: radial-gradient(circle, var(--cc) 3px, transparent 3.5px); background-size: 16px 16px;
}
.card .cart svg { width: 86%; height: auto; }
.card .cname { font-family: var(--f-pop); font-size: 13px; line-height: 1.2; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .citem { font-size: 10px; text-align: center; color: var(--pink-d); margin-top: 1px; }
.card .ctxt { font-size: 9.5px; line-height: 1.45; margin: 4px 0 0; color: var(--ink); font-weight: 500; overflow: hidden; }
.card.big { width: min(300px, 78vw); padding: 12px; border-radius: 26px; }
.card.big .ctop { font-size: 12px; } .card.big .cpref { font-size: 15px; }
.card.big .cname { font-size: 22px; } .card.big .citem { font-size: 13px; margin-top: 2px; } .card.big .ctxt { font-size: 12.5px; margin-top: 8px; }
.card .shine { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.9) 45%, rgba(255,200,240,.6) 50%, rgba(180,230,255,.6) 55%, transparent 70%);
  background-size: 250% 100%; animation: shine 3.2s ease-in-out infinite; }
@keyframes shine { 0% { background-position: 120% 0; } 60%, 100% { background-position: -60% 0; } }
.card.world { background: linear-gradient(160deg, #FFE7A0 0%, var(--white) 45%, #CDBBFF 100%); box-shadow: 0 0 0 3px #FFD46B, 0 0 0 5px var(--ink), 0 8px 18px rgba(91,58,74,.25); }
.card.locked { background: #EFE3E8; }
.card.locked .cart { background-image: none; background-color: #E3D3DA; border-style: dashed; }
.card.locked .cart span { font-family: var(--f-pop); font-size: 34px; color: #C9B1BC; }
.card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 12px; padding: 6px 4px; }
.card-grid .card { cursor: pointer; }

.reward { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; color: var(--white); width: 100%; }
.reward h3 { margin: 0; font-family: var(--f-pop); font-weight: 400; font-size: 28px; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; }
.reward .new { display: inline-block; background: var(--butter); color: var(--ink); font-family: var(--f-pop); padding: 3px 14px; border-radius: 99px; font-size: 14px; transform: rotate(-6deg); box-shadow: 0 3px 0 #E4BE4A; }
.flip-in { animation: flipIn .9s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes flipIn { 0% { transform: perspective(800px) rotateY(180deg) scale(.4); opacity: 0; } 60% { transform: perspective(800px) rotateY(-12deg) scale(1.05); opacity: 1; } 100% { transform: none; } }
.confetti { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px; z-index: 30; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

.empty-note { text-align: center; color: var(--ink-2); font-size: 13px; padding: 10px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
