<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひらがな かきかた</title>
<meta name="theme-color" content="#FFF6E5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{
  --bg:#FFF6E5;
  --paper:#FFFFFF;
  --ink:#2B2340;
  --ink-soft:#7A7190;
  --line:#E9DCC4;
  --guide:#F2B8B8;
  --accent:#FF7A59;
  --mic:#2E9BFF;
  --ok:#2FC46A;
  --kana:"Klee One","UD デジタル 教科書体 N-R","YuKyokasho","Hiragino Maru Gothic ProN",serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 16px 12px}
h1{margin:0;font-size:clamp(20px,4.5vw,30px);font-weight:800;letter-spacing:.06em;flex:1}
h1 span{color:var(--accent)}
.mic{display:flex;align-items:center;gap:10px;padding:12px 22px 12px 16px;border-radius:999px;
  background:var(--mic);color:#fff;font-weight:800;font-size:clamp(16px,3.6vw,22px);
  box-shadow:0 5px 0 #1C6FC0}
.mic:active{transform:translateY(3px);box-shadow:0 2px 0 #1C6FC0}
.mic svg{width:1.4em;height:1.4em}
.mic.listening{background:#FF4D6D;box-shadow:0 5px 0 #B8203F;animation:pulse 1s ease-in-out infinite}
.mic:disabled{background:#B9B4C6;box-shadow:0 5px 0 #8E89A0;cursor:not-allowed}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ---------- voice bubble ---------- */
.bubble{margin:0 16px 10px;padding:10px 16px;border-radius:16px;background:var(--paper);
  border:3px solid var(--line);font-size:clamp(15px,3.4vw,20px);text-align:center;min-height:1em}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;padding:0 16px 10px}
.tab{padding:8px 16px;border-radius:999px;background:var(--paper);border:3px solid var(--line);
  font-weight:800;font-size:clamp(14px,3.2vw,19px)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- 50音表 ---------- */
.table-wrap{overflow-x:auto;padding:0 16px max(16px,env(safe-area-inset-bottom));direction:rtl}
.gojuon{direction:rtl;display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,auto);
  gap:6px;min-width:min-content;margin:0 auto;width:max-content}
.cell{direction:ltr;width:var(--cw);height:var(--cw);border-radius:14px;background:var(--paper);
  border:3px solid var(--line);font-family:var(--kana);font-weight:600;font-size:calc(var(--cw)*.62);
  line-height:1;display:grid;place-items:center;padding:0 0 .08em;box-shadow:0 4px 0 var(--line)}
.cell:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.cell.blank{visibility:hidden}
.gojuon{--cw:clamp(40px,min(8vw,13vh),84px)}

/* ---------- stage (書き順) ---------- */
.stage{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;
  padding:max(10px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));z-index:10}
.stage-top{width:100%;display:flex;align-items:center;gap:10px}
.round{width:56px;height:56px;border-radius:50%;background:var(--paper);border:3px solid var(--line);
  display:grid;place-items:center;font-size:26px;font-weight:800;flex:none;box-shadow:0 4px 0 var(--line)}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.round svg{width:28px;height:28px}
.stage-title{flex:1;text-align:center;font-size:clamp(18px,4vw,26px);font-weight:800}
.stage-title b{font-family:var(--kana);font-size:1.5em;color:var(--accent);font-weight:600}
.board-row{flex:1;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;min-height:0}
.board{width:min(92vw,calc(100vh - 230px),640px);height:min(92vw,calc(100vh - 230px),640px);
  background:var(--paper);border:4px solid var(--guide);border-radius:12px;position:relative;flex:none}
@supports (height:100dvh){.board{width:min(92vw,calc(100dvh - 230px),640px);height:min(92vw,calc(100dvh - 230px),640px)}}
.board svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.nav{width:56px;height:56px}
@media (max-aspect-ratio:4/5){
  .board-row{flex-wrap:wrap;align-content:center;gap:12px 0}
  .board{order:-1}
  .board-row .nav{margin:0 auto}
}
.caption{font-size:clamp(18px,4.2vw,28px);font-weight:800;min-height:1.5em;margin:10px 0 6px;text-align:center}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{padding:10px 18px;border-radius:999px;background:var(--paper);border:3px solid var(--line);
  font-weight:800;font-size:clamp(14px,3.2vw,19px);box-shadow:0 4px 0 var(--line)}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 0 #1F8E4B}
.stage .mic{padding:10px 18px 10px 14px}

.num{font-family:var(--body);font-weight:800}
.badge{transform-box:fill-box;transform-origin:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.credit{font-size:11px;color:var(--ink-soft);text-align:center;padding:4px 16px 12px;direction:ltr}
.credit a{color:inherit}
</style>
</head>
<body>

<header>
  <h1>ひらがな <span>かきかた</span></h1>
  <button class="mic" id="micMain" aria-label="こえで きく">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
    <span>こえで きく</span>
  </button>
</header>

<div class="bubble" id="bubble">「あ の かきかた おしえて」って いってみてね。じを タッチしても いいよ。</div>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" data-set="seion" aria-selected="true">あいうえお</button>
  <button class="tab" role="tab" data-set="daku" aria-selected="false">が・ぱ</button>
  <button class="tab" role="tab" data-set="small" aria-selected="false">ちいさい じ</button>
</div>

<div class="table-wrap"><div class="gojuon" id="table"></div></div>
<div class="credit">かきじゅんデータ: <a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a> (CC BY-SA 3.0)</div>

<section class="stage" id="stage" hidden aria-live="polite">
  <div class="stage-top">
    <button class="round" id="back" aria-label="ひょうに もどる">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="stage-title"><b id="stageChar">あ</b> の かきかた</div>
    <button class="round" id="say" aria-label="よみあげる">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4Zm12.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4Z"/></svg>
    </button>
  </div>
  <div class="board-row">
    <button class="round nav" id="prev" aria-label="まえの じ">◀</button>
    <div class="board"><svg id="svg" viewBox="0 0 109 109"></svg></div>
    <button class="round nav" id="next" aria-label="つぎの じ">▶</button>
  </div>
  <div class="caption" id="caption"></div>
  <div class="controls">
    <button class="pill" id="slow" aria-pressed="true">🐢 ゆっくり</button>
    <button class="pill" id="replay">🔁 はじめから</button>
    <button class="mic" id="micStage" aria-label="こえで きく">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      <span>ほかの じ</span>
    </button>
  </div>
</section>

<script src="strokes.js"></script>
<script>
(() => {
const DATA = window.KANA_STROKES;
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const COLORS = ['#FF4D4D', '#2E9BFF', '#2FB45E', '#FF9F1C', '#A55EEA'];

/* ---------- 50音表 (たて書き・右から) ---------- */
const SETS = {
  seion: ['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ','まみむめも','や・ゆ・よ','らりるれろ','わ・・・を','ん・・・・'],
  daku:  ['がぎぐげご','ざじずぜぞ','だぢづでど','ばびぶべぼ','ぱぴぷぺぽ'],
  small: ['ぁぃぅぇぉ','ゃ・ゅ・ょ','っ・・・・','ゎ・・・・'],
};
let currentSet = 'seion';
function order() { return SETS[currentSet].join('').replace(/・/g, '').split(''); }

function renderTable() {
  const t = $('table');
  t.innerHTML = '';
  for (const col of SETS[currentSet]) {
    for (const ch of col) {
      const b = document.createElement('button');
      b.className = 'cell' + (ch === '・' ? ' blank' : '');
      if (ch !== '・') { b.textContent = ch; b.onclick = () => show(ch); }
      else b.tabIndex = -1;
      t.appendChild(b);
    }
  }
}
document.querySelectorAll('.tab').forEach(tab => tab.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === tab));
  currentSet = tab.dataset.set;
  renderTable();
});
function setFor(ch) {
  for (const k in SETS) if (SETS[k].join('').includes(ch)) return k;
  return currentSet;
}

/* ---------- 書き順アニメーション ---------- */
const svg = $('svg');
let current = null, timer = null, raf = 0, runId = 0, slow = true;

function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function drawGuide() {
  svg.innerHTML = '';
  const g = el('g', {stroke: '#F2B8B8', 'stroke-width': .6, 'stroke-dasharray': '2 2'}, svg);
  el('line', {x1: 54.5, y1: 0, x2: 54.5, y2: 109}, g);
  el('line', {x1: 0, y1: 54.5, x2: 109, y2: 54.5}, g);
}
const wait = ms => new Promise(r => { timer = setTimeout(r, ms); });
function animatePath(p, len, dur, id, tip) {
  return new Promise(resolve => {
    const t0 = performance.now();
    const step = now => {
      if (id !== runId) return resolve();
      const k = Math.min(1, (now - t0) / dur);
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; // ease-in-out
      p.style.strokeDashoffset = len * (1 - e);
      const pt = p.getPointAtLength(len * e);
      tip.setAttribute('cx', pt.x); tip.setAttribute('cy', pt.y);
      if (k < 1) raf = requestAnimationFrame(step); else resolve();
    };
    raf = requestAnimationFrame(step);
  });
}

async function play(ch) {
  const id = ++runId;
  cancelAnimationFrame(raf); clearTimeout(timer);
  const d = DATA[ch];
  const total = d.s.length;
  while (id === runId) {
    drawGuide();
    $('caption').textContent = `${total}かく で かくよ`;
    const strokes = el('g', {fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-width': 5.5}, svg);
    const badges = el('g', {}, svg);
    const tip = el('circle', {r: 3.4, fill: '#2B2340', opacity: 0}, svg);
    await wait(700);
    for (let i = 0; i < total && id === runId; i++) {
      const color = COLORS[i % COLORS.length];
      const p = el('path', {d: d.s[i], stroke: color}, strokes);
      const len = p.getTotalLength();
      p.style.strokeDasharray = `${len} ${len}`;
      p.style.strokeDashoffset = len;
      // 番号バッジ (KanjiVG の番号位置を中心に)
      const [nx, ny] = d.n[i];
      const bg = el('g', {class: 'badge'}, badges);
      el('circle', {cx: nx + 2.3, cy: ny - 2.9, r: 5.2, fill: color, stroke: '#fff', 'stroke-width': 1}, bg);
      const tx = el('text', {x: nx + 2.3, y: ny - 2.9, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-size': 6.8, fill: '#fff', class: 'num'}, bg);
      tx.textContent = i + 1;
      $('caption').innerHTML = `<span style="color:${color}">${i + 1}</span> かくめ`;
      const p0 = p.getPointAtLength(0);
      tip.setAttribute('cx', p0.x); tip.setAttribute('cy', p0.y);
      tip.setAttribute('opacity', 1);
      await wait(slow ? 450 : 250);
      if (id !== runId) return;
      const speed = slow ? 0.045 : 0.09; // 単位/ms
      await animatePath(p, len, Math.max(500, len / speed), id, tip);
      tip.setAttribute('opacity', 0);
      await wait(slow ? 600 : 300);
    }
    if (id !== runId) return;
    $('caption').textContent = 'できた！ 🎉';
    await wait(2200);
    if (id !== runId) return;
    svg.style.transition = 'opacity .4s'; svg.style.opacity = 0;
    await wait(450);
    svg.style.opacity = 1;
  }
}

function show(ch) {
  if (!DATA[ch]) return;
  current = ch;
  const s = setFor(ch);
  if (s !== currentSet) {
    currentSet = s;
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x.dataset.set === s));
    renderTable();
  }
  $('stageChar').textContent = ch;
  $('stage').hidden = false;
  speak(`${ch} の かきかた だよ`);
  play(ch);
}
function hide() { runId++; cancelAnimationFrame(raf); clearTimeout(timer); $('stage').hidden = true; }
function step(dir) {
  const o = order(); const i = o.indexOf(current);
  show(o[(i + dir + o.length) % o.length]);
}
$('back').onclick = hide;
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('replay').onclick = () => play(current);
$('say').onclick = () => speak(current);
$('slow').onclick = () => {
  slow = !slow;
  $('slow').setAttribute('aria-pressed', slow);
  play(current);
};
document.addEventListener('keydown', e => {
  if (DATA[e.key]) show(e.key);
  else if (e.key === 'Escape') hide();
});

/* ---------- 読み上げ ---------- */
function speak(text) {
  if (!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.9; u.pitch = 1.15;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ja'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ---------- 音声認識 ---------- */
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
// 1文字の音が漢字に変換されてしまうときの読み替え
const KANJI_READ = {
  '胃':'い','位':'い','井':'い','鵜':'う','絵':'え','江':'え','尾':'お','緒':'お',
  '蚊':'か','木':'き','気':'き','区':'く','九':'く','毛':'け','子':'こ','個':'こ','粉':'こ',
  '差':'さ','詩':'し','死':'し','酢':'す','巣':'す','背':'せ','瀬':'せ','祖':'そ',
  '田':'た','血':'ち','地':'ち','津':'つ','手':'て','戸':'と','名':'な','菜':'な',
  '二':'に','荷':'に','似':'に','根':'ね','音':'ね','野':'の','歯':'は','葉':'は','派':'は',
  '日':'ひ','火':'ひ','比':'ひ','麩':'ふ','府':'ふ','屁':'へ','帆':'ほ','穂':'ほ',
  '間':'ま','真':'ま','実':'み','身':'み','三':'み','六':'む','目':'め','芽':'め','藻':'も',
  '矢':'や','湯':'ゆ','世':'よ','夜':'よ','四':'よ','等':'ら','利':'り','留':'る','炉':'ろ',
  '輪':'わ','和':'わ','我':'が','蛾':'が','字':'じ','時':'じ','図':'ず','頭':'ず','場':'ば',
  '婆':'ば','美':'び','部':'ぶ','歩':'ぶ','碁':'ご','五':'ご','後':'ご','座':'ざ','出':'で',
  '度':'ど','土':'ど','痔':'じ','魔':'ま','無':'む','模':'も','喪':'も','露':'ろ'
};
const SMALL = {'あ':'ぁ','い':'ぃ','う':'ぅ','え':'ぇ','お':'ぉ','や':'ゃ','ゆ':'ゅ','よ':'ょ','つ':'っ','わ':'ゎ'};

function normalize(s) {
  s = s.replace(/\s|[、。！？!?「」『』.,]/g, '');
  s = s.replace(/[一-鿿]/g, c => KANJI_READ[c] && !/[書描教方]/.test(c) ? KANJI_READ[c] : c);
  return toHira(s);
}
function pick(raw) {
  let s = normalize(raw);
  // 「ちいさい つ」「小さいや」
  let m = s.match(/(?:小さい|ちいさい|ちっちゃい|ちいさな|小さな)([あいうえおやゆよつわ])/);
  if (m) return SMALL[m[1]];
  // 「わをんの を」
  if (/わ[をお]ん?の[をお]/.test(s)) return 'を';
  // 「◯ の かきかた / ◯ って どう かく / ◯ を おしえて / ◯ は どう かくの」
  m = s.match(/^(?:.*?)([ぁ-ゔ]{1,3})(?:ー)*(?:の|って|は|を|も)?(?:書き方|書きかた|かきかた|描き方|かき方|書く|書け|かく|かけ|どう|教えて|おしえて)/);
  let cand = m ? m[1] : s;
  cand = cand.replace(/ー+$/, '');
  // 「あの」→ 「あ」 など末尾の助詞を落とす
  if (cand.length > 1) cand = cand.replace(/(?:の|って|は|を)$/, '') || cand;
  // 「を」 は「お」と聞き取られやすいので、そのまま「お」扱い(子どもが選び直せる)
  if (cand.length === 1 && DATA[cand]) return cand;
  // 「ああ」「いー」のような伸ばしや重ね
  if (cand.length >= 2 && /^(.)\1+$/.test(cand) && DATA[cand[0]]) return cand[0];
  return null;
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
const mics = [$('micMain'), $('micStage')];
function say(text) { $('bubble').textContent = text; if (!$('stage').hidden) $('caption').textContent = text; }

if (!SR) {
  mics.forEach(m => { m.disabled = true; m.title = 'このブラウザは こえの にゅうりょくに たいおうしていません'; });
  $('micStage').hidden = true;
  $('bubble').textContent = 'このブラウザでは こえの にゅうりょくが つかえません(Chrome か Safari で ひらいてね)。じを タッチしてね。';
}

function listen() {
  if (!SR) return;
  if (listening) { rec && rec.abort(); return; }
  runId++; cancelAnimationFrame(raf); clearTimeout(timer);
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  rec = new SR();
  rec.lang = 'ja-JP'; rec.interimResults = false; rec.maxAlternatives = 5; rec.continuous = false;
  rec.onstart = () => { listening = true; mics.forEach(m => m.classList.add('listening')); say('きいてるよ… 「◯ の かきかた」って いってね'); };
  rec.onend = () => {
    listening = false; mics.forEach(m => m.classList.remove('listening'));
    if (!$('stage').hidden && current && !handled) play(current);
  };
  let handled = false;
  rec.onresult = e => {
    const alts = Array.from(e.results[0]).map(a => a.transcript);
    for (const t of alts) {
      const ch = pick(t);
      if (ch) { handled = true; $('bubble').textContent = `「${ch}」だね！`; show(ch); return; }
    }
    say(`「${alts[0]}」? もういちど いってね`);
    speak('もういちど いってね');
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') say('マイクが つかえないよ。おうちの ひとに マイクを「きょか」してもらってね');
    else if (e.error === 'no-speech') say('きこえなかったよ。もういちど おしてね');
    else if (e.error !== 'aborted') say('うまく きけなかったよ。もういちど おしてね');
  };
  try { rec.start(); } catch (_) {}
}
mics.forEach(m => m.onclick = listen);

renderTable();
if ('speechSynthesis' in window) speechSynthesis.getVoices();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.__pick = pick; // テスト用
})();
</script>
</body>
</html>
