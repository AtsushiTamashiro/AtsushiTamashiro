<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海辺ドライブ</title>
<meta name="description" content="沖縄の海沿いの道をドライブする2Dゲーム。車をかわし、ガソリンを拾い、どこまで走れるか挑戦しよう。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<style>
  :root {
    --bg: #0b1d2a;
    --panel: rgba(8, 20, 32, 0.82);
    --text: #f4f7fa;
    --muted: #9fb3c4;
    --accent: #ffcf3f;
    --danger: #ff5a5a;
    --ok: #4cd97b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #2f7d3a; box-shadow: 0 0 40px rgba(0,0,0,.5); }

  .hud { position: absolute; top: 0; left: 0; right: 0; pointer-events: none; padding: 10px 12px; display: flex; justify-content: space-between; gap: 8px; }
  .hud-box { background: var(--panel); border-radius: 10px; padding: 6px 10px; font-size: 14px; line-height: 1.35; min-width: 90px; }
  .hud-box b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .fuel-bar { width: 90px; height: 8px; background: #33424f; border-radius: 4px; overflow: hidden; margin-top: 3px; }
  .fuel-bar i { display: block; height: 100%; background: var(--ok); width: 100%; transition: background .3s; }

  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .overlay.hidden { display: none; }
  .card { background: var(--panel); border-radius: 16px; padding: 22px 22px 18px; max-width: 360px; width: 100%; text-align: center; backdrop-filter: blur(4px); }
  .card h1 { margin: 0 0 4px; font-size: 26px; }
  .card h2 { margin: 0 0 8px; font-size: 22px; }
  .card p { margin: 6px 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .card .big { color: var(--text); font-size: 18px; }
  .card ul { text-align: left; color: var(--muted); font-size: 13px; padding-left: 20px; margin: 10px 0; line-height: 1.7; }
  button.primary {
    margin-top: 12px; font: inherit; font-size: 17px; font-weight: 700; border: 0; border-radius: 999px;
    padding: 12px 30px; background: var(--accent); color: #2a2100; cursor: pointer;
  }
  button.primary:active { transform: scale(.97); }
  .new-record { color: var(--accent) !important; font-weight: 700; }

  .touch { position: absolute; bottom: 14px; left: 0; right: 0; display: none; justify-content: space-between; padding: 0 14px; pointer-events: none; }
  .touch .grp { display: flex; gap: 12px; pointer-events: auto; }
  .touch button {
    width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35);
    background: rgba(8,20,32,.55); color: #fff; font-size: 26px; touch-action: none;
  }
  .touch button.on { background: rgba(255,207,63,.6); }
  @media (hover: none), (pointer: coarse) { .touch { display: flex; } .kbd-only { display: none; } }

  .icon-btn { position: absolute; top: 96px; right: 12px; pointer-events: auto; background: var(--panel); color: var(--text); border: 0; border-radius: 8px; width: 38px; height: 34px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="800" aria-label="ドライブゲーム画面"></canvas>

  <div class="hud" id="hud">
    <div class="hud-box">距離<br><b id="h-dist">0.00</b> km<br><span style="font-size:12px;color:var(--muted)">ベスト <span id="h-best">0.00</span> km</span></div>
    <div class="hud-box" style="text-align:center">速度<br><b id="h-speed">0</b> km/h<br><span id="h-life">❤️❤️❤️</span></div>
    <div class="hud-box" style="text-align:right">⛽ 燃料<div class="fuel-bar"><i id="h-fuel"></i></div><span style="font-size:12px;color:var(--muted)">🪙 <span id="h-coin">0</span></span></div>
  </div>
  <button class="icon-btn" id="btn-pause" title="一時停止 (P)">⏸</button>
  <button class="icon-btn" id="btn-sound" title="サウンド切替 (M)" style="top:136px">🔊</button>

  <div class="overlay" id="ov-title">
    <div class="card">
      <h1>🚗 海辺ドライブ</h1>
      <p>エメラルドグリーンの海沿いを、どこまでも走ろう。</p>
      <ul>
        <li>🚙 前の車にぶつかるとライフが減る(3回で終了)</li>
        <li>⛽ 燃料は走るほど減る。ガソリン缶を拾って補給</li>
        <li>🪙 コインはボーナス距離 +0.1 km</li>
        <li>🌿 道からはみ出すと減速するので注意</li>
      </ul>
      <p class="kbd-only">操作: ← → ハンドル / ↑ アクセル / ↓ ブレーキ<br>(WASD も可) P: 一時停止 M: 音</p>
      <p style="display:none" class="touch-only">画面下のボタンで操作</p>
      <button class="primary" id="btn-start">スタート</button>
    </div>
  </div>

  <div class="overlay hidden" id="ov-pause">
    <div class="card"><h2>⏸ 一時停止中</h2><button class="primary" id="btn-resume">再開</button></div>
  </div>

  <div class="overlay hidden" id="ov-over">
    <div class="card">
      <h2 id="over-title">ゲームオーバー</h2>
      <p id="over-reason"></p>
      <p class="big">走行距離 <b id="over-dist">0.00</b> km</p>
      <p id="over-best"></p>
      <button class="primary" id="btn-retry">もう一度走る</button>
    </div>
  </div>

  <div class="touch" id="touch">
    <div class="grp">
      <button data-k="left" aria-label="左">◀</button>
      <button data-k="right" aria-label="右">▶</button>
    </div>
    <div class="grp">
      <button data-k="down" aria-label="ブレーキ">⏬</button>
      <button data-k="up" aria-label="アクセル">⏫</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- 基本設定 ----------
  const W = 480, H = 800;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const PLAYER_Y = H - 170;           // プレイヤーの画面上の位置
  const ROAD_W = 270;                 // 道路幅
  const LANES = 3;
  const LANE_W = ROAD_W / LANES;
  const CAR_W = 44, CAR_H = 78;
  const MAX_SPEED = 900;              // px/s
  const CRUISE = 520;
  const PX_PER_KM = 12000;            // 表示距離の換算

  const $ = id => document.getElementById(id);
  const ui = {
    dist: $('h-dist'), best: $('h-best'), speed: $('h-speed'), life: $('h-life'),
    fuel: $('h-fuel'), coin: $('h-coin'),
    title: $('ov-title'), pause: $('ov-pause'), over: $('ov-over'),
  };

  // ---------- 画面サイズ調整 ----------
  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', fit);
  fit();

  // ---------- 保存(失敗しても動くように) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  let best = store.get('drive.best', 0);
  let soundOn = store.get('drive.sound', true);

  // ---------- サウンド ----------
  let actx = null, engine = null, engineGain = null;
  function initAudio() {
    if (actx) return;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      engine = actx.createOscillator(); engine.type = 'sawtooth';
      const filt = actx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 400;
      engineGain = actx.createGain(); engineGain.gain.value = 0;
      engine.connect(filt).connect(engineGain).connect(actx.destination);
      engine.start();
    } catch (e) { actx = null; }
  }
  function beep(freq, dur, type = 'square', vol = 0.12, slide = 0) {
    if (!actx || !soundOn) return;
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  }
  function updateEngine(speed, running) {
    if (!engine) return;
    const t = actx.currentTime;
    engine.frequency.setTargetAtTime(45 + speed * 0.11, t, 0.08);
    engineGain.gain.setTargetAtTime(running && soundOn ? 0.035 : 0, t, 0.1);
  }

  // ---------- 疑似乱数(位置から決まる装飾用) ----------
  function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- コース形状 ----------
  // ワールド座標 wy(進行方向に増加)における道路の中心 x
  function roadCenter(wy) {
    return W / 2 - 20
      + Math.sin(wy * 0.00042) * 70
      + Math.sin(wy * 0.0011 + 1.7) * 28
      + Math.sin(wy * 0.00013 + 4.0) * 40;
  }
  const toScreenY = wy => PLAYER_Y - (wy - state.dist);
  const toWorldY = sy => state.dist + (PLAYER_Y - sy);
  const laneX = (wy, lane) => roadCenter(wy) - ROAD_W / 2 + LANE_W * (lane + 0.5);

  // ---------- 状態 ----------
  const keys = { left: false, right: false, up: false, down: false };
  let state;
  function newState() {
    return {
      mode: 'title',    // title | play | pause | over
      dist: 0, speed: 0, x: roadCenter(0), vx: 0,
      lives: 3, fuel: 100, coins: 0, bonus: 0,
      invul: 0, shake: 0, offroad: false,
      traffic: [], items: [], particles: [], popups: [],
      nextTraffic: 600, nextItem: 900, time: 0,
    };
  }
  state = newState();

  const TRAFFIC_COLORS = ['#3b82f6', '#f97316', '#a855f7', '#f5f5f5', '#10b981', '#64748b', '#eab308'];

  function spawnTraffic() {
    const wy = state.dist + H + 120;
    const lane = Math.floor(Math.random() * LANES);
    // 同じ車線の近くに既にいれば別の車線へ
    const blocked = state.traffic.some(t => t.lane === lane && Math.abs(t.wy - wy) < 260);
    if (blocked) return;
    const kind = Math.random() < 0.18 ? 'truck' : (Math.random() < 0.15 ? 'bus' : 'car');
    state.traffic.push({
      wy, lane, laneT: lane, lx: 0,
      speed: rand(220, 420) * (kind === 'car' ? 1 : 0.8),
      kind, color: TRAFFIC_COLORS[Math.floor(Math.random() * TRAFFIC_COLORS.length)],
      h: kind === 'car' ? CAR_H : (kind === 'bus' ? 130 : 110),
      w: kind === 'car' ? CAR_W : 50,
      changeT: rand(1.5, 5),
    });
  }
  function spawnItem() {
    const wy = state.dist + H + 120;
    const lane = Math.floor(Math.random() * LANES);
    const fuelNeed = state.fuel < 45 ? 0.6 : 0.3;
    const type = Math.random() < fuelNeed ? 'fuel' : 'coin';
    if (type === 'coin') {
      // コインは縦に並べる
      for (let i = 0; i < 5; i++) state.items.push({ wy: wy + i * 60, lane, type, t: Math.random() * 6 });
    } else {
      state.items.push({ wy, lane, type, t: 0 });
    }
  }

  // ---------- 入力 ----------
  const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
                   ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
  window.addEventListener('keydown', e => {
    const k = KEYMAP[e.key];
    if (k) { keys[k] = true; e.preventDefault(); }
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
    if (e.key === 'm' || e.key === 'M') toggleSound();
    if ((e.key === 'Enter' || e.key === ' ') && (state.mode === 'title' || state.mode === 'over')) { e.preventDefault(); start(); }
  });
  window.addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state.mode === 'play') togglePause(); });

  document.querySelectorAll('#touch button').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); keys[k] = true; b.classList.add('on'); initAudio(); };
    const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('pointerleave', off);
  });

  $('btn-start').onclick = start;
  $('btn-retry').onclick = start;
  $('btn-resume').onclick = togglePause;
  $('btn-pause').onclick = togglePause;
  $('btn-sound').onclick = toggleSound;
  $('btn-sound').textContent = soundOn ? '🔊' : '🔇';

  function start() {
    initAudio();
    if (actx && actx.state === 'suspended') actx.resume();
    state = newState();
    state.mode = 'play';
    state.speed = 200;
    ui.title.classList.add('hidden'); ui.over.classList.add('hidden'); ui.pause.classList.add('hidden');
    beep(440, 0.12, 'square', 0.08); setTimeout(() => beep(660, 0.18, 'square', 0.08), 120);
  }
  function togglePause() {
    if (state.mode === 'play') { state.mode = 'pause'; ui.pause.classList.remove('hidden'); }
    else if (state.mode === 'pause') { state.mode = 'play'; ui.pause.classList.add('hidden'); last = performance.now(); }
  }
  function toggleSound() {
    soundOn = !soundOn; store.set('drive.sound', soundOn);
    $('btn-sound').textContent = soundOn ? '🔊' : '🔇';
  }
  function gameOver(reason) {
    state.mode = 'over';
    const km = totalKm();
    const isNew = km > best;
    if (isNew) { best = km; store.set('drive.best', best); }
    $('over-title').textContent = reason === 'fuel' ? '⛽ ガス欠…' : '💥 ゲームオーバー';
    $('over-reason').textContent = reason === 'fuel' ? '燃料が尽きてしまいました。' : '車が動かなくなってしまいました。';
    $('over-dist').textContent = km.toFixed(2);
    const ob = $('over-best');
    ob.textContent = isNew ? '🏆 ベスト記録更新!' : `ベスト ${best.toFixed(2)} km`;
    ob.className = isNew ? 'new-record' : '';
    setTimeout(() => ui.over.classList.remove('hidden'), 700);
    beep(300, 0.6, 'sawtooth', 0.12, -250);
  }
  const totalKm = () => state.dist / PX_PER_KM + state.bonus;

  // ---------- 更新 ----------
  function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
    return Math.abs(ax - bx) * 2 < (aw + bw) && Math.abs(ay - by) * 2 < (ah + bh);
  }
  function addParticles(x, y, n, color, spd = 200) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = rand(spd * 0.3, spd);
      state.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, 0.9), max: 0.9, color, r: rand(2, 5) });
    }
  }
  function popup(x, y, text, color) { state.popups.push({ x, y, text, color, life: 1 }); }

  function update(dt) {
    const s = state;
    s.time += dt;
    // パーティクル類は常に更新
    for (const p of s.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; }
    s.particles = s.particles.filter(p => p.life > 0);
    for (const p of s.popups) { p.y -= 50 * dt; p.life -= dt; }
    s.popups = s.popups.filter(p => p.life > 0);
    if (s.shake > 0) s.shake = Math.max(0, s.shake - dt * 30);

    if (s.mode !== 'play') {
      if (s.mode === 'title') { s.dist += 260 * dt; s.x = laneX(s.dist, 1); }
      if (s.mode === 'over') { s.speed *= 0.95; s.dist += s.speed * dt; }
      return;
    }

    // 速度
    const center = roadCenter(s.dist);
    s.offroad = Math.abs(s.x - center) > ROAD_W / 2 - CAR_W * 0.25;
    let target = keys.up ? MAX_SPEED : CRUISE;
    if (keys.down) target = 80;
    if (s.offroad) target = Math.min(target, 260);
    const accel = keys.down ? 900 : (target > s.speed ? 300 : 500);
    s.speed += Math.sign(target - s.speed) * Math.min(Math.abs(target - s.speed), accel * dt);
    s.dist += s.speed * dt;

    // ハンドル(速度が出ているほど効く)
    const steer = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const grip = 0.35 + Math.min(1, s.speed / 500) * 0.65;
    s.vx += steer * 1250 * grip * dt;
    s.vx *= Math.pow(0.0025, dt);   // 摩擦
    s.vx = Math.max(-420, Math.min(420, s.vx));
    s.x += s.vx * dt;
    // 画面端・海に落ちない
    const limL = center - ROAD_W / 2 - 70, limR = center + ROAD_W / 2 + 40;
    if (s.x < limL) { s.x = limL; s.vx = Math.abs(s.vx) * 0.3; }
    if (s.x > limR) { s.x = limR; s.vx = -Math.abs(s.vx) * 0.3; }
    if (s.offroad && s.speed > 150 && Math.random() < 0.5) {
      state.particles.push({ x: s.x + rand(-18, 18), y: PLAYER_Y + 36, vx: rand(-40, 40), vy: rand(40, 120), life: 0.5, max: 0.5, color: '#c8b48a', r: rand(2, 4) });
    }

    // 燃料
    s.fuel -= dt * (2.2 + s.speed / MAX_SPEED * 3.2);
    if (s.fuel <= 0) { s.fuel = 0; gameOver('fuel'); return; }

    // 出現
    const difficulty = Math.min(1, s.dist / (PX_PER_KM * 8));   // 8kmで最大難易度
    if (s.dist > s.nextTraffic) { spawnTraffic(); s.nextTraffic = s.dist + rand(380, 760) * (1 - difficulty * 0.55); }
    if (s.dist > s.nextItem) { spawnItem(); s.nextItem = s.dist + rand(900, 1700); }

    // 交通
    for (const t of s.traffic) {
      t.wy += t.speed * dt;
      t.changeT -= dt;
      if (t.changeT <= 0) {
        t.changeT = rand(2.5, 6);
        if (t.kind === 'car' && Math.random() < 0.5 + difficulty * 0.3) {
          const nl = Math.max(0, Math.min(LANES - 1, t.laneT + (Math.random() < 0.5 ? -1 : 1)));
          const free = !s.traffic.some(o => o !== t && o.laneT === nl && Math.abs(o.wy - t.wy) < 200);
          if (free) t.laneT = nl;
        }
      }
      t.lane += Math.sign(t.laneT - t.lane) * Math.min(Math.abs(t.laneT - t.lane), dt * 0.9);
      t.sx = laneX(t.wy, 0) + LANE_W * t.lane;
      t.sy = toScreenY(t.wy);
    }
    // 追突防止(後ろの車は前の車の速度に合わせる)
    for (const t of s.traffic) for (const o of s.traffic) {
      if (o !== t && Math.abs(o.lane - t.lane) < 0.6 && o.wy > t.wy && o.wy - t.wy < (o.h + t.h) / 2 + 30) t.speed = Math.min(t.speed, o.speed);
    }
    s.traffic = s.traffic.filter(t => t.sy < H + 300 && t.sy > -400);

    // 衝突判定
    if (s.invul > 0) s.invul -= dt;
    for (const t of s.traffic) {
      if (s.invul <= 0 && rectHit(s.x, PLAYER_Y, CAR_W - 6, CAR_H - 8, t.sx, t.sy, t.w - 6, t.h - 8)) {
        s.lives--; s.invul = 2; s.shake = 14;
        s.speed *= 0.35;
        s.vx = (s.x < t.sx ? -1 : 1) * 260;
        t.speed += 120;
        addParticles((s.x + t.sx) / 2, (PLAYER_Y + t.sy) / 2, 26, '#ffb347', 320);
        beep(120, 0.35, 'sawtooth', 0.18, -60);
        if (s.lives <= 0) { gameOver('crash'); return; }
      }
    }

    // アイテム
    for (const it of s.items) {
      it.t += dt;
      it.sx = laneX(it.wy, it.lane); it.sy = toScreenY(it.wy);
      if (!it.got && rectHit(s.x, PLAYER_Y, CAR_W, CAR_H, it.sx, it.sy, 30, 30)) {
        it.got = true;
        if (it.type === 'fuel') {
          s.fuel = Math.min(100, s.fuel + 35);
          popup(it.sx, it.sy, '⛽ +35', '#4cd97b'); beep(520, 0.1, 'triangle', 0.15, 400);
          addParticles(it.sx, it.sy, 12, '#4cd97b', 160);
        } else {
          s.coins++; s.bonus += 0.1;
          popup(it.sx, it.sy, '+0.1km', '#ffcf3f'); beep(988, 0.08, 'square', 0.07); setTimeout(() => beep(1318, 0.1, 'square', 0.07), 60);
        }
      }
    }
    s.items = s.items.filter(it => !it.got && it.sy < H + 100);
  }

  // ---------- 描画 ----------
  function drawScenery() {
    const step = 8;
    // 草地
    ctx.fillStyle = '#4c9a3f'; ctx.fillRect(0, 0, W, H);
    // さとうきび畑のしま模様
    ctx.fillStyle = '#5aa94a';
    const off = state.dist % 80;
    for (let y = -80 + off; y < H; y += 80) ctx.fillRect(0, y, W, 40);

    // 砂浜と海(右側)
    ctx.beginPath();
    ctx.moveTo(W, -10);
    for (let sy = -10; sy <= H + 10; sy += step) ctx.lineTo(roadCenter(toWorldY(sy)) + ROAD_W / 2 + 34, sy);
    ctx.lineTo(W, H + 10); ctx.closePath();
    ctx.fillStyle = '#f1dfa6'; ctx.fill();

    ctx.beginPath();
    ctx.moveTo(W + 10, -10);
    for (let sy = -10; sy <= H + 10; sy += step) {
      const wy = toWorldY(sy);
      ctx.lineTo(roadCenter(wy) + ROAD_W / 2 + 78 + Math.sin(wy * 0.01 + state.time * 1.5) * 6, sy);
    }
    ctx.lineTo(W + 10, H + 10); ctx.closePath();
    const sea = ctx.createLinearGradient(W - 160, 0, W, 0);
    sea.addColorStop(0, '#3fd6c6'); sea.addColorStop(0.35, '#1fb0c9'); sea.addColorStop(1, '#0b6fa8');
    ctx.fillStyle = sea; ctx.fill();
    // 波打ち際の白波
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3; ctx.beginPath();
    for (let sy = -10; sy <= H + 10; sy += step) {
      const wy = toWorldY(sy);
      const x = roadCenter(wy) + ROAD_W / 2 + 78 + Math.sin(wy * 0.01 + state.time * 1.5) * 6;
      sy === -10 ? ctx.moveTo(x, sy) : ctx.lineTo(x, sy);
    }
    ctx.stroke();
    // 海のきらめき
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    const g0 = Math.floor(toWorldY(H) / 90);
    for (let g = g0; g < g0 + H / 90 + 2; g++) {
      const sy = toScreenY(g * 90 + hash(g) * 60);
      const x = roadCenter(g * 90) + ROAD_W / 2 + 100 + hash(g + 7) * 200;
      if (x < W) ctx.fillRect(x, sy, 10 + hash(g + 3) * 14, 2);
    }
  }

  function drawRoad() {
    const step = 8;
    const edge = (sign, extra) => {
      const pts = [];
      for (let sy = -10; sy <= H + 10; sy += step) pts.push([roadCenter(toWorldY(sy)) + sign * (ROAD_W / 2 + extra), sy]);
      return pts;
    };
    const fillBand = (extraL, extraR, color) => {
      const L = edge(-1, extraL), R = edge(1, extraR);
      ctx.beginPath(); ctx.moveTo(L[0][0], L[0][1]);
      for (const p of L) ctx.lineTo(p[0], p[1]);
      for (let i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    };
    fillBand(14, 14, '#c9c2b0');   // 路肩
    fillBand(0, 0, '#3b3f46');     // アスファルト

    // 白い外側線
    ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 4;
    for (const sign of [-1, 1]) {
      const pts = edge(sign, -6);
      ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    }
    // 車線の破線
    ctx.fillStyle = '#f2f2f2';
    const dash = 60, gap = 50, period = dash + gap;
    const wTop = toWorldY(-20), wBot = toWorldY(H + 20);
    for (let w = Math.floor(wBot / period) * period; w < wTop; w += period) {
      for (let l = 1; l < LANES; l++) {
        const x0 = roadCenter(w) - ROAD_W / 2 + LANE_W * l;
        const x1 = roadCenter(w + dash) - ROAD_W / 2 + LANE_W * l;
        const y0 = toScreenY(w), y1 = toScreenY(w + dash);
        ctx.beginPath(); ctx.moveTo(x0 - 2, y0); ctx.lineTo(x1 - 2, y1); ctx.lineTo(x1 + 2, y1); ctx.lineTo(x0 + 2, y0); ctx.fill();
      }
    }
    // 距離標(1kmごと)
    const k0 = Math.floor(wBot / PX_PER_KM), k1 = Math.ceil(wTop / PX_PER_KM);
    for (let k = Math.max(1, k0); k <= k1; k++) {
      const wy = k * PX_PER_KM, sy = toScreenY(wy);
      const x = roadCenter(wy) - ROAD_W / 2 - 30;
      ctx.fillStyle = '#fff'; ctx.fillRect(x - 16, sy - 12, 32, 22);
      ctx.fillStyle = '#1b5fb0'; ctx.fillRect(x - 14, sy - 10, 28, 18);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(k + 'km', x, sy);
    }
  }

  function drawPalm(x, y, s, sway) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(10 * s, 10 * s, 26 * s, 12 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(sway);
    ctx.fillStyle = '#2f8f3a';
    for (let i = 0; i < 6; i++) {
      ctx.save(); ctx.rotate(i * Math.PI / 3);
      ctx.beginPath(); ctx.ellipse(16 * s, 0, 18 * s, 6 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#1f6e2a';
    for (let i = 0; i < 6; i++) {
      ctx.save(); ctx.rotate(i * Math.PI / 3 + 0.5);
      ctx.beginPath(); ctx.ellipse(11 * s, 0, 12 * s, 4 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#7a5230'; ctx.beginPath(); ctx.arc(0, 0, 4 * s, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function drawHouse(x, y, seed) {
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(x - 24, y - 16, 52, 40);
    ctx.fillStyle = seed > 0.5 ? '#e9e4da' : '#f3efe6'; ctx.fillRect(x - 28, y - 22, 52, 40);
    // 赤瓦屋根
    ctx.fillStyle = '#c4492c'; ctx.fillRect(x - 24, y - 18, 44, 32);
    ctx.fillStyle = '#e8e1d6'; ctx.fillRect(x - 24, y - 3, 44, 2);
    // シーサー(屋根の上の小さな点)
    ctx.fillStyle = '#d99a2b'; ctx.beginPath(); ctx.arc(x - 2, y - 3, 3, 0, Math.PI * 2); ctx.fill();
  }
  function drawSideObjects() {
    const spacing = 110;
    const wBot = toWorldY(H + 80), wTop = toWorldY(-80);
    for (let g = Math.floor(wBot / spacing); g <= Math.ceil(wTop / spacing); g++) {
      const wy = g * spacing + hash(g) * 50, sy = toScreenY(wy), c = roadCenter(wy);
      const r = hash(g + 101);
      if (r < 0.12) {
        drawHouse(c - ROAD_W / 2 - 70 - hash(g + 5) * 40, sy, hash(g + 9));
      } else {
        const x = c - ROAD_W / 2 - 40 - hash(g + 3) * (c - ROAD_W / 2 - 40);
        drawPalm(Math.max(20, x), sy, 0.8 + hash(g + 2) * 0.5, Math.sin(state.time * 1.3 + g) * 0.08);
      }
      // 砂浜側のヤシ
      if (hash(g + 55) < 0.35) drawPalm(c + ROAD_W / 2 + 54, sy + 30, 0.7, Math.sin(state.time * 1.1 + g * 2) * 0.1);
      // ハイビスカス
      if (hash(g + 77) < 0.5) {
        const fx = c - ROAD_W / 2 - 26, fy = sy + 40;
        ctx.fillStyle = '#2e7d32'; ctx.beginPath(); ctx.arc(fx, fy, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ff3d6e'; ctx.beginPath(); ctx.arc(fx - 3, fy - 2, 4, 0, Math.PI * 2); ctx.arc(fx + 4, fy + 2, 3.5, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawCar(x, y, w, h, color, opts = {}) {
    ctx.save(); ctx.translate(x, y);
    if (opts.tilt) ctx.rotate(opts.tilt);
    // 影
    ctx.fillStyle = 'rgba(0,0,0,.3)'; roundRect(-w / 2 + 4, -h / 2 + 6, w, h, 10); ctx.fill();
    // タイヤ
    ctx.fillStyle = '#111';
    for (const ty of [-h * 0.3, h * 0.3]) { ctx.fillRect(-w / 2 - 3, ty - 9, 6, 18); ctx.fillRect(w / 2 - 3, ty - 9, 6, 18); }
    // ボディ
    ctx.fillStyle = color; roundRect(-w / 2, -h / 2, w, h, 10); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)'; roundRect(-w / 2 + 4, -h / 2 + 3, w * 0.3, h - 6, 6); ctx.fill();
    // ガラス
    ctx.fillStyle = '#1c2a3a';
    roundRect(-w / 2 + 6, -h / 2 + h * 0.2, w - 12, h * 0.2, 4); ctx.fill();   // フロント
    roundRect(-w / 2 + 7, h / 2 - h * 0.27, w - 14, h * 0.13, 3); ctx.fill();  // リア
    // ルーフ
    ctx.fillStyle = opts.roof || color; roundRect(-w / 2 + 6, -h / 2 + h * 0.42, w - 12, h * 0.28, 4); ctx.fill();
    // ライト
    ctx.fillStyle = '#fff6c2'; ctx.fillRect(-w / 2 + 4, -h / 2 + 1, 9, 4); ctx.fillRect(w / 2 - 13, -h / 2 + 1, 9, 4);
    ctx.fillStyle = opts.brake ? '#ff2a2a' : '#a31212'; ctx.fillRect(-w / 2 + 4, h / 2 - 5, 9, 4); ctx.fillRect(w / 2 - 13, h / 2 - 5, 9, 4);
    if (opts.stripe) { ctx.fillStyle = opts.stripe; ctx.fillRect(-4, -h / 2, 8, h); }
    ctx.restore();
  }
  function drawBig(t) {
    const { sx: x, sy: y, w, h } = t;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; roundRect(-w / 2 + 5, -h / 2 + 7, w, h, 6); ctx.fill();
    if (t.kind === 'truck') {
      ctx.fillStyle = t.color; roundRect(-w / 2, -h / 2, w, 30, 6); ctx.fill();          // キャブ
      ctx.fillStyle = '#1c2a3a'; ctx.fillRect(-w / 2 + 5, -h / 2 + 6, w - 10, 9);
      ctx.fillStyle = '#d9d9d9'; roundRect(-w / 2, -h / 2 + 33, w, h - 33, 4); ctx.fill(); // 荷台
      ctx.strokeStyle = '#b5b5b5'; ctx.lineWidth = 2;
      for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-w / 2 + 3, -h / 2 + 33 + (h - 33) * i / 4); ctx.lineTo(w / 2 - 3, -h / 2 + 33 + (h - 33) * i / 4); ctx.stroke(); }
    } else {
      ctx.fillStyle = '#f2f2f2'; roundRect(-w / 2, -h / 2, w, h, 8); ctx.fill();
      ctx.fillStyle = t.color; ctx.fillRect(-w / 2, -h / 2 + 20, w, 10); ctx.fillRect(-w / 2, h / 2 - 30, w, 6);
      ctx.fillStyle = '#1c2a3a'; ctx.fillRect(-w / 2 + 5, -h / 2 + 4, w - 10, 12);
      ctx.fillStyle = '#cfd8dc'; for (let i = 0; i < 3; i++) ctx.fillRect(-10, -h / 2 + 42 + i * 26, 20, 14);
    }
    ctx.fillStyle = '#a31212'; ctx.fillRect(-w / 2 + 3, h / 2 - 5, 8, 4); ctx.fillRect(w / 2 - 11, h / 2 - 5, 8, 4);
    ctx.restore();
  }

  function drawItems() {
    for (const it of state.items) {
      if (it.sy === undefined) continue;
      const x = it.sx, y = it.sy;
      if (it.type === 'fuel') {
        const bob = Math.sin(it.t * 5) * 2;
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x + 3, y + 16, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e53935'; roundRect(x - 13, y - 15 + bob, 26, 30, 5); ctx.fill();
        ctx.fillStyle = '#b71c1c'; ctx.fillRect(x + 2, y - 21 + bob, 8, 7);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('F', x, y + 1 + bob);
      } else {
        const sq = Math.abs(Math.cos(it.t * 4));
        ctx.fillStyle = '#d4a017'; ctx.beginPath(); ctx.ellipse(x, y, 11 * sq + 2, 11, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.ellipse(x, y, 8 * sq + 1, 8, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function draw() {
    const s = state;
    ctx.save();
    if (s.shake > 0) ctx.translate(rand(-s.shake, s.shake) * 0.5, rand(-s.shake, s.shake) * 0.5);
    drawScenery();
    drawRoad();
    drawSideObjects();
    drawItems();
    for (const t of s.traffic) {
      if (t.sy === undefined) continue;
      if (t.kind === 'car') drawCar(t.sx, t.sy, t.w, t.h, t.color, { tilt: (t.laneT - t.lane) * 0.25 });
      else drawBig(t);
    }
    // プレイヤー
    const blink = s.invul > 0 && Math.floor(s.invul * 10) % 2 === 0;
    if (!blink && s.mode !== 'title') {
      drawCar(s.x, PLAYER_Y, CAR_W, CAR_H, '#e8262b', { tilt: s.vx / 2200, brake: keys.down, stripe: 'rgba(255,255,255,.85)', roof: '#c81e23' });
    }
    if (s.mode === 'title') drawCar(s.x, PLAYER_Y, CAR_W, CAR_H, '#e8262b', { stripe: 'rgba(255,255,255,.85)', roof: '#c81e23' });

    for (const p of s.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of s.popups) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = '#000'; ctx.fillText(p.text, p.x + 1, p.y + 1);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;

    // スピード感の線
    if (s.speed > 650 && s.mode === 'play') {
      ctx.strokeStyle = `rgba(255,255,255,${(s.speed - 650) / 900})`; ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const x = hash(i + Math.floor(s.time * 20)) * W, y = hash(i * 3 + Math.floor(s.time * 20)) * H;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 60); ctx.stroke();
      }
    }
    // 燃料警告
    if (s.mode === 'play' && s.fuel < 20 && Math.floor(s.time * 3) % 2 === 0) {
      ctx.fillStyle = 'rgba(255,60,60,.12)'; ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  function updateHud() {
    const s = state;
    ui.dist.textContent = totalKm().toFixed(2);
    ui.best.textContent = best.toFixed(2);
    ui.speed.textContent = Math.round(s.speed * 0.16);
    ui.life.textContent = '❤️'.repeat(Math.max(0, s.lives)) + '🖤'.repeat(Math.max(0, 3 - s.lives));
    ui.fuel.style.width = s.fuel + '%';
    ui.fuel.style.background = s.fuel < 20 ? 'var(--danger)' : (s.fuel < 45 ? 'var(--accent)' : 'var(--ok)');
    ui.coin.textContent = s.coins;
  }

  // ---------- メインループ ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state.mode !== 'pause') update(dt);
    draw();
    updateHud();
    updateEngine(state.speed, state.mode === 'play');
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
